<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rage Quit Rumble</title>
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0d0618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column arena scoreboard. Hero header with game and season switch, podium, then tabbed panels.
   Deliberately dark-only: a night arena with frost-blue and trophy-gold light. */
:root{
  --bg:#080c18; --bg2:#0d1430; --surface:#111831; --surface2:#162042; --sunk:#1a2446; --ink:#eef2ff; --muted:#93a0c6; --line:#253158;
  --accent:#4fd8ff; --accent2:#9b7bff; --accent-ink:#04121c; --accent-soft:#0f2e45;
  --win:#3ee09a; --win-soft:#0f3328; --loss:#ff6b7d; --loss-soft:#3d1622; --gold:#ffc857; --gold-soft:#3b2d0e;
  --silver:#cfd8ec; --bronze:#e0995e;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.btn.discord{background:#5865f2;border-color:#5865f2;color:#fff;display:inline-flex;gap:8px;align-items:center}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header.top{display:grid;gap:14px}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:700;letter-spacing:-.01em;text-transform:uppercase}
.brand h1 .slash{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 .22em;transform:skewX(-12deg);margin-left:.08em}
.brand h1 .slash span{display:inline-block;transform:skewX(12deg)}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .85rem var(--display);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.season{display:flex;align-items:center;gap:8px}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs button{font:600 .95rem var(--display);letter-spacing:.02em;background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;position:relative;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-2px;height:3px;background:var(--accent);transform:skewX(-20deg)}

/* controls */
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 .9rem var(--display);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.headline{margin:2px 0 0;font:600 1rem var(--display);color:var(--ink);opacity:.9}
.headline:before{content:"“";color:var(--accent);margin-right:2px}
.headline:after{content:"”";color:var(--accent);margin-left:2px}
/* quirk chips */
.quirks{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 8px}
.quirk{font:600 .74rem var(--display);letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:rgba(155,123,255,.14);border:1px solid rgba(155,123,255,.35);color:#cdbdff;white-space:nowrap}
.quirk small{color:var(--muted);font-weight:500}
/* award cards */
.awards{margin-top:14px;display:grid;gap:10px}
.awards-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.awards-head h4{margin:0;font:700 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:#ff9fb2}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.acard{--edge:linear-gradient(160deg,#ff6b7d,#9b7bff 55%,#ff6b7d);position:relative;flex:0 0 190px;height:270px;border-radius:14px;overflow:hidden;scroll-snap-align:start;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 0%,#3a1838,#140d24 70%);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s ease, box-shadow .25s ease}
.acard:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:4;pointer-events:none}
.acard.glory{--edge:linear-gradient(160deg,#fff1b8,#ffc857 40%,#b8862b 75%,#ffe39a);background:radial-gradient(120% 80% at 50% 0%,#3d3010,#15110a 70%)}
.acard:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 24px rgba(255,107,125,.25)}
.acard.glory:hover{box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 28px rgba(255,200,87,.35)}
.acard .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;z-index:0;filter:saturate(1.1)}
.acard .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,12,24,.55) 0%,rgba(8,12,24,0) 28%,rgba(8,12,24,.2) 48%,rgba(8,12,24,.92) 72%,#080c18 100%)}
.acard .shine{position:absolute;inset:-50%;z-index:2;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-60%);transition:transform .8s ease;pointer-events:none}
.acard:hover .shine{transform:translateX(60%)}
.acard .top{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:8px;align-items:center}
.acard .ico{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:50%;font-size:1.15rem;background:rgba(8,12,24,.75);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.acard .ttl{font:700 .78rem/1.15 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.acard .bot{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:grid;gap:4px}
.acard .val{font:700 2.1rem/1 var(--display);color:#ff9fb2;text-shadow:0 2px 14px rgba(255,107,125,.45)}
.acard.glory .val{color:var(--gold);text-shadow:0 2px 14px rgba(255,200,87,.45)}
.acard .unit{font:600 .72rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.acard .who{display:flex;gap:6px;align-items:center;min-width:0;margin-top:4px}
.acard .who b{font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .who .av{width:22px;height:22px;font-size:.7rem}
.acard .quip{margin:0;font:500 .82rem var(--display);line-height:1.3;color:#d5dbf2}
.shame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shame-grid .acard{flex:none;width:100%;height:250px}
.shame-grid .acard .val{font-size:1.8rem}
@media (max-width:560px){ .shame-grid{display:flex;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory} .shame-grid .acard{flex:0 0 170px} }
/* ceremony */
.stage{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(60% 55% at 50% 42%,rgba(155,123,255,.22),rgba(8,12,24,.97) 70%),#080c18;color:var(--ink);overflow:hidden}
.stage:before{content:"";position:absolute;left:50%;top:-20%;width:70vmin;height:120%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,255,255,.07) 175deg,rgba(255,255,255,.12) 180deg,rgba(255,255,255,.07) 185deg,transparent 200deg);pointer-events:none}
.stage-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;position:relative;z-index:2}
.stage-top .btn{white-space:nowrap}
.stage-top .kicker{font:700 .78rem var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stage-body{display:grid;place-items:center;padding:8px 16px;position:relative;z-index:2;min-height:0;overflow:auto}
.stage-foot{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 16px 22px;position:relative;z-index:2}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.acard.big{flex:none;width:min(330px,78vw);height:min(470px,62vh);border-radius:20px}
.acard.big .val{font-size:3.6rem}
.acard.big .ttl{font-size:1rem}
.acard.big .ico{width:46px;height:46px;flex-basis:46px;font-size:1.5rem}
.acard.big .quip{font-size:.98rem}
.acard.big .who .av{width:28px;height:28px}
.acard.big .who b{font-size:1.1rem}
.reveal{animation:reveal .75s cubic-bezier(.2,1.3,.4,1) both}
@keyframes reveal{0%{opacity:0;transform:perspective(900px) rotateY(95deg) scale(.6)}60%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
.title-slide{text-align:center;display:grid;gap:14px;justify-items:center;max-width:640px}
.title-slide .big-t{font:700 clamp(2.4rem,9vw,4.6rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(100deg,#fff,var(--accent) 45%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.title-slide .result{font:700 1.3rem var(--display)}
.title-slide .result b{color:var(--win)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(760px,100%)}
.vs .col{background:rgba(17,24,49,.8);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;animation:pop .6s both}
.vs .col:nth-child(2){animation-delay:.15s}
.vs .col.won{border-color:var(--win);box-shadow:0 0 30px rgba(62,224,154,.15)}
.vs h3{display:flex;justify-content:space-between;align-items:center}
.vs .qrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk)}
.vs .qrow .qi{font-size:1.4rem}.vs .qrow b{font-family:var(--display);display:block}.vs .qrow span{font-size:.85rem;color:var(--muted)}
@media (max-width:560px){ .vs{grid-template-columns:1fr} }
.confetti{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){ .reveal,.title-slide .big-t,.vs .col{animation:none} .confetti{display:none} .acard,.acard .shine{transition:none} }

label.btn{display:inline-block}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.panel>*,.grid2>*,.wrap>*{min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
td.rank{font-family:var(--display);font-weight:700;color:var(--muted);width:2.2em;text-align:left}
tr.lead td.rank{color:var(--gold)}
td.pts{font-family:var(--display);font-weight:700;font-size:1.05rem}
.pl{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pl button{all:unset;cursor:pointer}
.pl button:hover{color:var(--accent)}
.av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover}
.av-txt{display:inline-grid;place-items:center;background:var(--sunk);color:var(--muted);font:700 .8rem var(--display)}
.form{display:inline-flex;gap:3px}
.pip{width:16px;height:16px;border-radius:3px;font:700 .62rem/16px var(--display);text-align:center}
.pip.w{background:var(--win-soft);color:var(--win)}
.pip.l{background:var(--loss-soft);color:var(--loss)}
.tag{display:inline-block;font:700 .7rem var(--display);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.tag.mvp{background:var(--gold-soft);color:var(--gold)}
.tag.win{background:var(--win-soft);color:var(--win)}
.tag.loss{background:var(--loss-soft);color:var(--loss)}
.tag.trophy{background:var(--gold-soft);color:var(--gold);display:inline-flex;align-items:center;gap:3px}
.tag.penta{background:var(--loss-soft);color:var(--loss)}
.augs{font-size:.8rem;color:var(--muted);padding-left:34px;margin-top:-3px}
.talk{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.talk-line{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;min-width:0}
.talk-line .body{min-width:0;overflow-wrap:anywhere}
.talk-line .x{margin-left:auto;font-size:.8rem}
.talk-form{display:flex;gap:6px}
.talk-form input{flex:1 1 auto}
.hof{display:grid;gap:4px}
.mini th,.mini td{padding:5px 6px;font-size:.88rem}
.tag.you{background:var(--accent-soft);color:var(--accent)}

/* records */
.records{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .big{font:700 1.5rem var(--display)}
.rec.shame .big{color:var(--loss)}
.rec .what{display:grid;min-width:0}
.rec .what b{font-family:var(--display);font-weight:600}
.rec .what span{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* matches */
.match{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.match-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.side{display:grid;gap:4px;min-width:0}
.side h3{display:flex;gap:8px;align-items:center}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:.92rem;padding:3px 0}
.line .who2{min-width:0;overflow-wrap:anywhere}
.line .pick{color:var(--muted)}

/* log form */
.logform{display:grid;gap:14px}
.row-fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{width:100%}
.roster{display:grid;gap:6px}
.roster-row{display:grid;gap:6px;align-items:center}
.roster-row input,.roster-row select{width:100%}
.roster-head{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.team-block{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.team-block.won{border-color:var(--win);background:var(--win-soft)}
.radio{display:inline-flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}
.err{color:var(--loss);font-weight:600}

/* player page */
.roster-list{display:flex;flex-wrap:wrap;gap:8px}
.pcard{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--surface);cursor:pointer;font-weight:600}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.tile .v{font:700 1.45rem var(--display);font-variant-numeric:tabular-nums}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph .av{width:48px;height:48px;font-size:1.2rem}
.ph h2{font-size:1.6rem}

.gamecard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem}
.kv b{font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.match,.panel{animation:rise .25s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

/* ---- arena skin ---- */
body{background:
  radial-gradient(900px 500px at 10% -10%, rgba(79,216,255,.16), transparent 60%),
  radial-gradient(800px 500px at 100% 0%, rgba(155,123,255,.16), transparent 60%),
  linear-gradient(180deg, var(--bg2), var(--bg) 600px) fixed, var(--bg)}
header.top{background:linear-gradient(135deg, rgba(79,216,255,.10), rgba(155,123,255,.10));border:1px solid var(--line);border-radius:16px;padding:20px 20px 0;position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg, transparent 0 22px, rgba(255,255,255,.025) 22px 23px);pointer-events:none}
header.top>*{position:relative}
.brand h1{letter-spacing:.01em;text-shadow:0 0 28px rgba(79,216,255,.25)}
.brand h1 .slash{background:linear-gradient(100deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 6px 24px rgba(79,216,255,.25)}
.tagline{margin:-6px 0 0;color:var(--muted);font:500 .95rem var(--display);letter-spacing:.06em;text-transform:uppercase}
.chip{background:rgba(255,255,255,.04)}
.chip[aria-pressed="true"]{background:linear-gradient(100deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
nav.tabs{border-bottom:0;margin-inline:-20px;padding-inline:12px;background:rgba(0,0,0,.18);border-top:1px solid var(--line)}
nav.tabs button{padding:13px 14px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]::after{background:linear-gradient(90deg,var(--accent),var(--accent2));height:3px;bottom:0}
.panel{background:linear-gradient(180deg,var(--surface2),var(--surface));border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{background:var(--sunk)}
.btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 16px rgba(79,216,255,.2)}
.btn.primary:hover{filter:brightness(1.08)}
input,select,textarea{background:var(--bg);border-color:var(--line)}
tbody tr:hover td{background:rgba(255,255,255,.03)}
tr.lead td{background:rgba(255,200,87,.06)}
.banner{background:linear-gradient(100deg,rgba(79,216,255,.14),rgba(155,123,255,.14));border:1px solid var(--line)}
.tile{background:var(--bg);border:1px solid var(--line)}
.tile .v{color:var(--ink)}
.match{background:rgba(0,0,0,.18)}
.team-block.won{background:var(--win-soft)}
.rec .big{color:var(--accent)}
.av-txt{font-weight:700}
/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{border:1px solid var(--line);border-radius:14px;padding:14px 10px 12px;display:grid;justify-items:center;gap:4px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));position:relative;min-width:0}
.pod .av{width:52px;height:52px;font-size:1.3rem;border:2px solid var(--medal)}
.pod .name{font:600 1rem var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font:700 1.6rem var(--display);color:var(--medal);line-height:1}
.pod .place{position:absolute;top:8px;left:10px;font:700 .8rem var(--display);color:var(--medal)}
.pod.p1{--medal:var(--gold);padding-block:22px 16px;border-color:rgba(255,200,87,.5);box-shadow:0 0 36px rgba(255,200,87,.15)}
.pod.p1 .av{width:64px;height:64px}
.pod.p2{--medal:var(--silver)}
.pod.p3{--medal:var(--bronze)}
@media (max-width:520px){.pod .pts{font-size:1.25rem}.pod .av{width:42px;height:42px}.pod.p1 .av{width:52px;height:52px}}

/* ===== clean scoreboard ===== */
.match{border:1px solid var(--line);border-radius:14px;padding:0;display:grid;gap:0;overflow:hidden;background:linear-gradient(180deg,rgba(22,32,66,.55),rgba(8,12,24,.4))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.mh-l{display:grid;gap:2px;min-width:0}
.mh-meta{font:700 .78rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mh-meta i{font-style:normal;margin:0 8px;color:var(--line)}
.mh .headline{margin:0;font:600 .95rem var(--display);color:var(--ink)}
.mh .headline:before,.mh .headline:after{content:none}
.mh-r{display:flex;gap:6px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;opacity:.55}
.icon-btn:hover{opacity:1;background:var(--loss-soft)}
.icon-btn.chat{width:auto;padding:0 8px;gap:4px;display:inline-flex;align-items:center;opacity:.8}.icon-btn.chat:hover{background:var(--accent-soft)}
.icon-btn.chat span{font:700 .75rem var(--display);color:var(--accent)}
.panel.bare{background:none;border:0;padding:0;box-shadow:none}
.panel.bare > .match + .match{margin-top:0}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.sb-team{padding:10px 16px 12px;display:grid;gap:2px;min-width:0;position:relative}
.sb-team:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.sb-team.won:before{background:var(--win);box-shadow:0 0 12px var(--win)}
.sb-team.lost:before{background:var(--loss)}
.sb-team.won{background:linear-gradient(90deg,rgba(62,224,154,.07),transparent 60%)}
.sb-team.lost{background:linear-gradient(90deg,rgba(255,107,125,.05),transparent 60%)}
.sb-team + .sb-team{border-left:1px solid var(--line)}
@media (max-width:860px){ .sb-team + .sb-team{border-left:0;border-top:1px solid var(--line)} }
.sb-th{display:flex;align-items:center;gap:10px;padding:2px 0 8px;min-width:0}
.sb-th .res{font:700 1.05rem var(--display);letter-spacing:.14em;text-transform:uppercase}
.won .res{color:var(--win)}.lost .res{color:var(--loss)}
.sb-th .tn{font:600 .78rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sb-th .th-dmg{margin-left:auto;font:600 .68rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:110px;text-align:right}
.sb-row{display:grid;grid-template-columns:26px minmax(0,1fr) 92px 110px;gap:10px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:8px}
.sb-row:hover{background:rgba(255,255,255,.03)}
.sb-row.is-mvp{background:linear-gradient(90deg,rgba(255,200,87,.10),transparent 70%)}
.sb-row:has(.sb-stats){grid-template-columns:26px minmax(0,1fr) auto}
.sb-name{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;row-gap:0}
.nm{all:unset;cursor:pointer;font:600 .95rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nm:hover{color:var(--accent)}
.you-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.sb-champ{flex-basis:100%;font-size:.8rem;color:var(--muted);line-height:1.2}
.sb-champ:empty{display:none}
.mvp-chip,.mk{font:700 .62rem var(--display);letter-spacing:.08em;padding:1px 6px;border-radius:4px}
.mvp-chip{background:var(--gold);color:#241a00}
.mk{border:1px solid currentColor}
.mk-triple{color:var(--accent)}.mk-quadra{color:var(--accent2)}.mk-penta{color:#04121c;background:linear-gradient(90deg,var(--loss),var(--gold));border-color:transparent}
.sb-kda{font:700 1rem var(--display);text-align:center;white-space:nowrap}
.sb-kda i{font-style:normal;color:var(--muted);margin:0 3px;font-weight:400}
.sb-kda b{color:var(--loss)}
.sb-stats{font-size:.85rem;color:var(--muted);text-align:right}
.sb-dmg{display:grid;gap:4px;justify-items:end}
.sb-dmg .num{font:600 .85rem var(--display)}
.sb-dmg .bar{width:100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.sb-dmg .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.sb-place{font:700 1rem var(--display);color:var(--muted);width:20px}
.sb-more{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.78rem;color:var(--muted)}
.sb-more .aug{padding:1px 7px;border-radius:999px;background:var(--sunk)}
.sb-th .tn{white-space:nowrap}
@media (max-width:480px){ .sb-row{grid-template-columns:26px minmax(0,1fr) 76px 64px;gap:8px} .sb-th{flex-wrap:wrap;row-gap:6px} .sb-th .th-dmg{display:none} .sb-kda{font-size:.9rem} .hl-tile{padding:8px 16px} }
.sb-team .quirk{font:600 .7rem var(--display);padding:2px 8px;border-radius:999px;background:rgba(155,123,255,.14);border:1px solid rgba(155,123,255,.35);color:#cdbdff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb-team .quirks{margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.hl-tile{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#0c1226;min-width:0}
.hl-ico{font-size:1.3rem;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(255,107,125,.12);flex:none}
.hl-txt{display:grid;min-width:0}
.hl-t{font:700 .7rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:#ff9fb2}
.hl-w{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-w b{color:var(--ink);font-family:var(--display)}
.match .talk{padding:10px 16px 12px;border-top:1px solid var(--line)}
.match .talk:not(:has(.talk-line)):not(:has(.talk-form)){display:none}

/* ===== logo theme: neon synthwave ===== */
:root{
  --bg:#0b0516; --bg2:#170a2b; --surface:#150a28; --surface2:#1e0f3a; --sunk:#241247; --line:#3b2268; --ink:#f7f1ff; --muted:#b9a8dc;
  --accent:#20f0e4; --accent2:#ff3fd2; --lime:#c6ff2e; --flame:#ff8a1f; --accent-ink:#0b0516; --accent-soft:#0c3a40;
  --win:#5dff9e; --win-soft:#0f3a2a; --loss:#ff4d8d; --loss-soft:#3e0f2a; --gold:#ffd23f; --gold-soft:#3f300a;
  --title:"Bungee","Chakra Petch",system-ui,sans-serif;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{background:linear-gradient(180deg,rgba(11,5,22,.55),rgba(11,5,22,.92) 700px),url(bg.jpg) center top/cover fixed,var(--bg)}
header.top{background:linear-gradient(135deg,rgba(32,240,228,.08),rgba(255,63,210,.10) 55%,rgba(255,138,31,.08));border:1px solid rgba(255,63,210,.35);border-radius:18px;padding:16px 20px 0;
  box-shadow:0 0 0 1px rgba(32,240,228,.08),0 0 40px rgba(255,63,210,.18),0 20px 50px rgba(0,0,0,.5)}
header.top::before{background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.logo{width:clamp(130px,22vw,210px);height:auto;border-radius:16px;display:block;box-shadow:0 0 0 2px rgba(255,63,210,.5),0 0 30px rgba(255,63,210,.45),0 0 60px rgba(32,240,228,.2)}
.hero-side{display:grid;gap:12px;min-width:0}
.who-row{display:flex;justify-content:flex-end}
.tagline{margin:0;font:400 clamp(1rem,2.6vw,1.45rem)/1.15 var(--title);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.tagline b{font-weight:400;background:linear-gradient(90deg,var(--lime),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px rgba(198,255,46,.35))}
@media (max-width:620px){ .hero{grid-template-columns:1fr;justify-items:center;text-align:center} .who-row,.tagline{justify-content:center} .controls{justify-content:center} .logo{width:min(240px,70vw)} }
h2{font-family:var(--title);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:1.15rem;background:linear-gradient(90deg,var(--lime),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.panel{background:linear-gradient(180deg,rgba(30,15,58,.92),rgba(21,10,40,.92));border:1px solid rgba(255,63,210,.22);border-radius:16px;box-shadow:0 0 0 1px rgba(32,240,228,.05),0 14px 40px rgba(0,0,0,.45)}
.panel.bare{background:none;border:0;box-shadow:none}
.chip{background:rgba(255,255,255,.04);border-color:var(--line);font-family:var(--display)}
.chip[aria-pressed="true"]{background:linear-gradient(100deg,var(--accent2),#a63dff);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(255,63,210,.5)}
nav.tabs{background:rgba(0,0,0,.28);border-top:1px solid rgba(255,63,210,.25);margin-top:16px}
nav.tabs button{font-family:var(--title);font-weight:400;letter-spacing:.04em;text-transform:uppercase;font-size:.88rem}
nav.tabs button[aria-selected="true"]{color:#fff;text-shadow:0 0 12px rgba(32,240,228,.7)}
nav.tabs button[aria-selected="true"]::after{background:linear-gradient(90deg,var(--lime),var(--accent),var(--accent2));height:3px;box-shadow:0 0 12px var(--accent)}
.btn{background:var(--sunk);border-color:var(--line)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(100deg,var(--lime),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 18px rgba(32,240,228,.35)}
.btn.primary:hover{filter:brightness(1.1);box-shadow:0 0 26px rgba(198,255,46,.45)}
input,select,textarea{background:rgba(11,5,22,.8);border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.banner{background:linear-gradient(100deg,rgba(32,240,228,.12),rgba(255,63,210,.12));border:1px solid rgba(255,63,210,.3)}
.rec .big{color:var(--accent);text-shadow:0 0 14px rgba(32,240,228,.4)}
.rec.shame .big{color:var(--loss);text-shadow:0 0 14px rgba(255,77,141,.4)}
tr.lead td{background:rgba(198,255,46,.07)}
.pod.p1{box-shadow:0 0 24px rgba(255,210,63,.25)}
.match{background:linear-gradient(180deg,rgba(30,15,58,.85),rgba(15,7,30,.85));border-color:rgba(255,63,210,.22);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sb-th .res{font-family:var(--title);font-weight:400;font-size:1.05rem;letter-spacing:.06em}
.won .res{text-shadow:0 0 14px rgba(93,255,158,.55)}.lost .res{text-shadow:0 0 14px rgba(255,77,141,.5)}
.sb-dmg .bar i{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.sb-team .quirk{background:rgba(255,63,210,.12);border-color:rgba(255,63,210,.4);color:#ffb3ef}
.hl-tile{background:rgba(11,5,22,.7)}
.hl-t{color:var(--flame)}
.hl-ico{background:rgba(255,138,31,.14)}
.mvp-chip{background:var(--gold)}
.awards-head h4{color:var(--flame)}
.title-slide .big-t{font-family:var(--title);font-weight:400;background:linear-gradient(100deg,var(--lime),var(--accent) 45%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{background:radial-gradient(60% 55% at 50% 42%,rgba(255,63,210,.22),rgba(11,5,22,.97) 70%),var(--bg)}
.dots i.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
#toast{background:linear-gradient(100deg,var(--lime),var(--accent));color:var(--accent-ink)}
@media (max-width:480px){ nav.tabs{padding-inline:4px} nav.tabs button{padding:12px 9px;font-size:.78rem} }

/* hall of shame tiles */
.shame-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:960px){ .shame-grid{grid-template-columns:repeat(6,minmax(0,1fr))} }
.shame-tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;text-align:center;gap:6px;padding:18px 12px 14px;border-radius:14px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,63,210,.16),rgba(11,5,22,.6) 70%);border:1px solid rgba(255,63,210,.3);transition:transform .2s,box-shadow .2s,border-color .2s}
.shame-tile:hover,.shame-tile:focus-visible{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 0 22px rgba(255,63,210,.35)}
.s-ico{font-size:1.9rem;line-height:1;filter:drop-shadow(0 0 10px rgba(255,63,210,.5))}
.s-ttl{font:400 .78rem/1.2 var(--title);letter-spacing:.04em;text-transform:uppercase;color:var(--flame);min-height:2.4em;display:grid;place-items:center}
.s-val{font:700 2rem/1 var(--display);color:#fff;text-shadow:0 0 16px rgba(32,240,228,.55)}
.s-unit{white-space:nowrap;font:600 .7rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.s-who{display:flex;gap:6px;align-items:center;margin-top:4px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.06);font:600 .85rem var(--display);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.s-who .av{width:22px;height:22px;font-size:.7rem}
@media (max-width:560px){ .shame-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible} }
.pid-cell{display:flex;gap:4px;min-width:0}.pid-cell select{flex:1 1 auto;min-width:0}.add-riot{flex:none;padding:4px 9px;font-size:1rem;line-height:1}

/* ceremony as a framed window, not a takeover */
.stage{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,2,14,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.stage:before{content:none}
.stage-box{position:relative;width:min(900px,100%);height:min(760px,100%);display:grid;grid-template-rows:auto 1fr auto;border-radius:22px;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 40%,rgba(255,63,210,.20),transparent 70%),linear-gradient(180deg,#1b0c35,#0d0619);
  border:1px solid rgba(255,63,210,.45);box-shadow:0 0 0 1px rgba(32,240,228,.1),0 0 50px rgba(255,63,210,.3),0 30px 80px rgba(0,0,0,.6)}
.stage .confetti{z-index:3}
.acard{clip-path:inset(0 round 14px)}
.acard.big{clip-path:inset(0 round 20px)}
.stage .acard:hover{transform:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.stage .acard .shine{display:none}
.acard.big{height:min(470px,calc(100vh - 220px))}

/* penalty jar */
.pen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:linear-gradient(90deg,rgba(255,138,31,.14),transparent 70%)}
.pen-t{font:400 .78rem var(--title);letter-spacing:.04em;text-transform:uppercase;color:var(--flame);white-space:nowrap}
.pen-x{font:600 .92rem var(--display)}
.pen-jar{font-size:3.4rem;filter:drop-shadow(0 0 18px rgba(255,138,31,.6));animation:pop .6s both}
.pen-big{font:700 clamp(1.2rem,3.4vw,1.7rem)/1.3 var(--display);margin:0;max-width:560px}
.title-slide .av{width:56px;height:56px;font-size:1.4rem;border:2px solid var(--flame);box-shadow:0 0 18px rgba(255,138,31,.5)}
/* rivalries */
.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.rv{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i t" "a n" "l l";gap:4px 10px;align-items:center;padding:12px;border-radius:12px;background:rgba(11,5,22,.6);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.rv:hover,.rv:focus-visible{border-color:var(--accent2);box-shadow:0 0 16px rgba(255,63,210,.3)}
.rv-i{grid-area:i;font-size:1.3rem}.rv-t{grid-area:t;font:400 .74rem var(--title);text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.rv .av{grid-area:a}.rv b{grid-area:n;font:600 1rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-l{grid-area:l;font-size:.82rem;color:var(--muted)}
/* achievements */
.ach-count{font:400 .9rem var(--title);color:var(--lime)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "i d";gap:0 10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(11,5,22,.5);border:1px solid var(--line);opacity:.45;filter:grayscale(1)}
.ach.got{opacity:1;filter:none;border-color:rgba(198,255,46,.35);background:linear-gradient(135deg,rgba(198,255,46,.08),rgba(32,240,228,.06));box-shadow:0 0 14px rgba(198,255,46,.08)}
.ach-i{grid-area:i;font-size:1.5rem}
.ach-n{grid-area:n;font:700 .85rem var(--display);line-height:1.2}
.ach-d{grid-area:d;font-size:.72rem;color:var(--muted);line-height:1.25}
.ach-more{margin-top:8px}.ach-more summary{cursor:pointer;font:600 .85rem var(--display);color:var(--accent);margin-bottom:8px}
/* organiser settings */
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0;padding-top:4px}
@media (max-width:700px){ .set-row{grid-template-columns:1fr;gap:10px} }
.set-txt{display:grid;gap:4px;align-content:start}.set-txt b{font:700 1rem var(--display)}.set-txt .muted{font-size:.86rem}
.set-status{font:700 .78rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set-status.ok{color:var(--win);text-shadow:0 0 10px rgba(93,255,158,.5)}
.set-ctl{display:grid;gap:8px;align-content:start}
.set-ctl input,.set-ctl textarea{width:100%}
.set-ctl textarea{font:500 .88rem/1.4 var(--body);resize:vertical}
.how{font-size:.82rem;color:var(--muted)}.how summary{cursor:pointer;color:var(--accent)}
.switch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font:700 .85rem var(--display);width:fit-content}
.switch i{width:46px;height:26px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);position:relative;transition:background .2s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on i{background:linear-gradient(90deg,var(--lime),var(--accent));border-color:transparent;box-shadow:0 0 14px rgba(32,240,228,.4)}
.switch.on i:after{transform:translateX(20px);background:#0b0516}
.switch:focus-visible i{outline:2px solid var(--accent);outline-offset:2px}

/* stats card */
.form-ico{margin-left:6px;font-size:.95rem;cursor:help}
.pc-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(6,2,14,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pc{width:min(420px,100%);max-height:100%;overflow:auto;border-radius:20px;background:linear-gradient(180deg,#1e0f3a,#0d0619);border:1px solid rgba(255,63,210,.45);box-shadow:0 0 40px rgba(255,63,210,.3),0 30px 70px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}
.pc-hero{position:relative;height:190px;overflow:hidden;background:radial-gradient(90% 90% at 50% 0%,rgba(255,63,210,.35),transparent 70%)}
.pc-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,5,22,.1),rgba(11,5,22,.35) 45%,#1e0f3a)}
.pc-x{all:unset;cursor:pointer;position:absolute;top:10px;right:10px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(11,5,22,.7);color:#fff;z-index:2}
.pc-x:hover{background:var(--accent2)}
.pc-id{position:absolute;left:16px;right:16px;bottom:12px;display:flex;gap:12px;align-items:center;z-index:2}
.pc-av{width:58px!important;height:58px!important;font-size:1.4rem!important;border:2px solid var(--accent2);box-shadow:0 0 16px rgba(255,63,210,.5)}
.pc-name{display:grid;min-width:0}
.pc-name b{font:400 1.45rem/1.1 var(--title);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.pc-name span{font:600 .8rem var(--display);color:var(--muted)}
.pc-body{padding:14px 16px 16px;display:grid;gap:14px}
.fm{display:grid;gap:8px}
.fm-top{display:flex;justify-content:space-between;align-items:baseline}
.fm-l{font:600 .72rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fm-top b{font:700 1rem var(--display)}
.fm.hot .fm-top b{color:var(--flame);text-shadow:0 0 12px rgba(255,138,31,.5)}
.fm.cold .fm-top b{color:#7fd4ff;text-shadow:0 0 12px rgba(79,195,255,.5)}
.fm-bar{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,#4fc3ff,#9b7bff 50%,#ff8a1f)}
.fm-bar i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #0b0516;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(255,255,255,.7)}
.fm-res{display:flex;gap:4px;align-items:center;font-size:.75rem}.fm-res .muted{margin-left:6px}
.pc-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-tiles div{display:grid;gap:2px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.pc-tiles span{font:600 .66rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pc-tiles b{font:400 1.25rem var(--title);color:var(--lime)}
.pc-facts{display:grid;gap:6px}
.pc-facts div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;border-bottom:1px solid var(--line)}
.pc-facts div:last-child{border-bottom:0}
.pc-facts span{color:var(--muted)}.pc-facts b{font:600 .92rem var(--display);text-align:right}.pc-facts small{color:var(--muted);font-weight:500}
.pc-btns{display:flex;gap:8px;justify-content:flex-end}

/* voice clips */
.clips-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.clips-t{font:400 .78rem var(--title);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-right:2px}
.clip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:3px 6px 3px 3px;border-radius:999px;background:rgba(32,240,228,.08);border:1px solid rgba(32,240,228,.3)}
.clip.on{border-color:var(--accent);box-shadow:0 0 14px rgba(32,240,228,.35)}
.clip .play,.cm-c .play{all:unset;cursor:pointer;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--accent));color:#0b0516;font-size:.75rem}
.play.on{background:var(--accent2);color:#fff}
.clip-l{font:600 .85rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.clip-l small{color:var(--muted);font-weight:500}
.clip-x{all:unset;cursor:pointer;color:var(--muted);font-size:.75rem;padding:0 4px}.clip-x:hover{color:var(--loss)}
.clip-stack{display:grid;gap:10px;width:100%}
.clip.big{padding:8px 16px 8px 8px;justify-content:flex-start}.clip.big .play{width:42px;height:42px;font-size:1rem}.clip.big .clip-l{font-size:1.05rem}
.cm{width:min(640px,100%);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#1e0f3a,#0d0619);border:1px solid rgba(255,63,210,.45);box-shadow:0 0 40px rgba(255,63,210,.3),0 30px 70px rgba(0,0,0,.6)}
.cm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cm-head>div{display:grid;gap:2px}
.cm-body{padding:16px 18px;display:grid;gap:12px;overflow:auto;align-content:start}
.cm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}.cm-foot .muted{font-size:.8rem}
.drop{display:grid;gap:4px;justify-items:center;text-align:center;padding:22px 16px;border:2px dashed rgba(32,240,228,.4);border-radius:14px;cursor:pointer;background:rgba(32,240,228,.04)}
.drop:hover{border-color:var(--accent);background:rgba(32,240,228,.08)}.drop.off{opacity:.5;pointer-events:none}
.drop b{font:400 1rem var(--title);text-transform:uppercase;color:var(--accent)}.drop span{font-size:.84rem;color:var(--muted);max-width:440px}
.cm-files{display:grid;gap:6px}
.cm-file{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,180px);gap:10px;align-items:center;font-size:.85rem;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.cm-fn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ .cm-file{grid-template-columns:1fr} }
.cm-list{display:grid;gap:8px}
.cm-c{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(11,5,22,.6);border:1px solid var(--line)}
.cm-c.off{opacity:.5}
.cm-meta{display:grid;gap:0;font:600 .8rem var(--display);white-space:nowrap}.cm-heat{font-size:.7rem}
.cm-c input[type=text],.cm-c input:not([type]){width:100%}
.keep{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;white-space:nowrap;cursor:pointer}
@media (max-width:560px){ .cm-c{grid-template-columns:auto 1fr auto} .cm-c input:not([type]){grid-column:1/-1} }
</style>

<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>Rage Quit <span class="slash"><span>Rumble</span></span></h1></div>
    <p class="muted">Loading the tournament…</p>
  </header>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</body>
</html>
<script src="config.js"></script>
<script>
const TEMPLATES = {
  aram: { name:"ARAM Mayhem", short:"ARAM", format:"teams", teamSize:5, pickLabel:"Champion",
    stats:[{key:"k",label:"Kills"},{key:"d",label:"Deaths"},{key:"a",label:"Assists"},{key:"dmg",label:"Damage"},{key:"heal",label:"Healing"}],
    kda:{k:"k",d:"d",a:"a"}, shameStat:"d", mvpStat:"kda", dmgStat:"dmg", healStat:"heal", augments:true, multikills:true,
    points:{win:3,loss:0,mvp:1,multi:{triple:1,quadra:2,penta:3}} },
  lol: { name:"League of Legends", short:"LoL", format:"teams", teamSize:5, pickLabel:"Champion",
    stats:[{key:"k",label:"Kills"},{key:"d",label:"Deaths"},{key:"a",label:"Assists"},{key:"cs",label:"CS"}],
    kda:{k:"k",d:"d",a:"a"}, shameStat:"d", mvpStat:"kda", points:{win:3,loss:0,mvp:1} },
  valorant: { name:"Valorant", short:"Valorant", format:"teams", teamSize:5, pickLabel:"Agent",
    stats:[{key:"k",label:"Kills"},{key:"d",label:"Deaths"},{key:"a",label:"Assists"},{key:"acs",label:"ACS"}],
    kda:{k:"k",d:"d",a:"a"}, shameStat:"d", mvpStat:"acs", points:{win:3,loss:0,mvp:1} },
  rocketleague: { name:"Rocket League", short:"RL", format:"teams", teamSize:3, pickLabel:"Car",
    stats:[{key:"goals",label:"Goals"},{key:"saves",label:"Saves"},{key:"assists",label:"Assists"},{key:"score",label:"Score"}],
    kda:null, shameStat:null, mvpStat:"score", points:{win:3,loss:0,mvp:1} },
  mariokart: { name:"Mario Kart", short:"MK", format:"ffa", teamSize:12, pickLabel:"Character",
    stats:[{key:"falls",label:"Falls"}], kda:null, shameStat:"falls", mvpStat:null,
    points:{placements:[10,7,5,3,2,1],mvp:0} }
};
const DISCORD_ICON = '<svg width="18" height="14" viewBox="0 0 71 55" aria-hidden="true"><path fill="currentColor" d="M60.1 4.9A58.5 58.5 0 0 0 45.6.4a40 40 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A39 39 0 0 0 25.8.4 58.4 58.4 0 0 0 11.2 4.9C2 18.7-.5 32.2.7 45.5a58.8 58.8 0 0 0 18 9.1 43 43 0 0 0 3.8-6.2 38 38 0 0 1-6-2.9l1.5-1.1a42 42 0 0 0 35.9 0l1.5 1.1a38 38 0 0 1-6 2.9 43 43 0 0 0 3.8 6.2 58.6 58.6 0 0 0 18-9.1c1.5-15.4-2.5-28.8-10.6-40.6ZM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2c0 4-2.8 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2c0 4-2.8 7.2-6.4 7.2Z"/></svg>';
const MULTI = [["triple","Triple"],["quadra","Quadra"],["penta","Penta"]];
const TROPHY_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h10v2h4v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V19h4v3H7v-3h4v-3.1A5 5 0 0 1 7.6 12 5 5 0 0 1 3 7V4h4V2Zm0 4H5v1a3 3 0 0 0 2 2.8V6Zm10 0v3.8A3 3 0 0 0 19 7V6h-2Z"/></svg>';
const TABS = [["standings","Standings"],["matches","Matches"],["players","Players"],["games","Games"]];
const YEAR = String(new Date().getFullYear());
const S = {
  sb:null, me:null, isAdmin:false, canWrite:false, authReady:false, ready:false, noDb:false,
  games:{}, players:{}, matches:[], loaded:{games:false,players:false,matches:false},
  profiles:{}, comments:[], commentsOff:false, settings:{}, settingsOff:false, clips:[], clipsOff:false, clipper:null, playing:null, hookDraft:"", penDraft:null, cdraft:{}, confirmGameDel:null, gameId:null, season:YEAR, tab:"standings", viewPlayer:null,
  form:null, formErr:"", confirmDel:null, busy:false,
  join:{tag:""}, addp:{tag:""}, editTag:null,
  ng:{name:"",format:"teams",teamSize:"5",pickLabel:"",stats:"",shame:"",mvp:"",win:"3",loss:"0",mvpPts:"1",placements:"10,7,5,3,2,1"}
};
try{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h; }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmt1 = n => Math.abs(n)>=1000 ? Math.round(n).toLocaleString() : (Math.round(n*10)/10).toFixed(1);
const big = n => (+n||0).toLocaleString();
const pct = (a,b) => b ? Math.round(100*a/b)+"%" : "–";
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "x";
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return iso; } };

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function writeError(e){
  if(e && (e.code==="42501" || /row-level security|permission/i.test(e.message||""))) return "You can't change this yet. Ask the organiser to approve you on the Players tab.";
  if(e && e.code==="23505") return "That already exists.";
  return "Couldn't save just now. Check your connection and try again.";
}

/* ---------- scoring ---------- */
const G = () => S.games[S.gameId];
function kdaVal(g, s){ if(!g.kda) return 0; const k=+s[g.kda.k]||0, d=+s[g.kda.d]||0, a=+s[g.kda.a]||0; return (k+a)/Math.max(1,d); }
function isWin(g,m,e){ return g.format==="ffa" ? (+e.place===1) : e.team===m.winner; }
function mvpOf(g,m){
  if(!g.mvpStat) return null; let best=null, bv=-Infinity;
  for(const e of m.entries||[]){ const s=e.stats||{}; const v = g.mvpStat==="kda" ? kdaVal(g,s) : (+s[g.mvpStat]||0); if(v>bv){bv=v;best=e.pid;} }
  return best;
}
function entryPoints(g,m,e,mvp){
  const p=g.points||{}; let pts;
  if(g.format==="ffa") pts=(p.placements||[])[(+e.place||0)-1]||0;
  else pts = e.team===m.winner ? (p.win??3) : (p.loss??0);
  if(mvp && mvp===e.pid) pts += (p.mvp??0);
  if(g.multikills && p.multi) for(const [k] of MULTI) pts += (+(e.multi||{})[k]||0)*(+p.multi[k]||0);
  return pts;
}
function filtered(){ return S.matches.filter(m=>m.game===S.gameId && (S.season==="all"||m.season===S.season)); }
function aggregate(g, ms){
  const T={};
  const row = pid => T[pid] ??= {pid,games:0,wins:0,losses:0,pts:0,mvps:0,sums:{},picks:{},form:[],placeSum:0,multi:{},augs:{}};
  for(const m of ms){
    const mvp=mvpOf(g,m);
    for(const e of m.entries||[]){
      const r=row(e.pid), w=isWin(g,m,e);
      r.games++; w ? r.wins++ : r.losses++;
      r.pts += entryPoints(g,m,e,mvp); if(mvp===e.pid) r.mvps++;
      for(const st of g.stats||[]) r.sums[st.key]=(r.sums[st.key]||0)+(+(e.stats||{})[st.key]||0);
      if(e.pick){ const k=e.pick.trim().toLowerCase(); const pk=r.picks[k] ??= {name:e.pick.trim(),games:0,wins:0,pts:0}; pk.games++; if(w) pk.wins++; }
      if(r.form.length<5) r.form.push(w);
      if(g.format==="ffa") r.placeSum += +e.place||0;
      for(const [k] of MULTI) r.multi[k]=(r.multi[k]||0)+(+(e.multi||{})[k]||0);
      for(const a of e.augments||[]){ const k=a.toLowerCase(); const x=r.augs[k] ??= {name:a,games:0,wins:0}; x.games++; if(w) x.wins++; }
    }
  }
  const list=Object.values(T);
  for(const r of list) r.kda = g.kda ? kdaVal(g, r.sums) : 0;
  list.sort((a,b)=> b.pts-a.pts || (b.wins/b.games)-(a.wins/a.games) || b.kda-a.kda || b.games-a.games);
  return list;
}
function records(g, ms){
  const out=[];
  for(const st of g.stats||[]){
    let best=null;
    for(const m of ms) for(const e of m.entries||[]){ const v=+(e.stats||{})[st.key]||0; if(!best||v>best.v) best={v,pid:e.pid,m,pick:e.pick}; }
    if(best && best.v>0){
      const shame = st.key===g.shameStat;
      const heal = st.key===g.healStat;
      out.push({...best, shame, title: shame ? "Rage quit award" : heal ? "Healbot" : "Most "+lc(st.label), sub: shame ? `Most ${lc(st.label)} in one game` : heal ? `Most ${lc(st.label)} in one game` : "In one game", value:best.v.toLocaleString()});
    }
  }
  if(g.kda){
    let best=null;
    for(const m of ms) for(const e of m.entries||[]){ const v=kdaVal(g,e.stats||{}); if(!best||v>best.v) best={v,pid:e.pid,m,pick:e.pick}; }
    if(best && best.v>0) out.unshift({...best, title:"Best KDA", sub:"In one game", value:fmt1(best.v)});
  }
  if(g.dmgStat){
    const dk=g.dmgStat, de=g.kda?.d||g.shameStat;
    let glass=null, paci=null;
    for(const m of ms){
      const es=m.entries||[]; if(!es.length) continue;
      const top=es.reduce((a,b)=>(+(b.stats||{})[dk]||0)>(+(a.stats||{})[dk]||0)?b:a);
      const maxD=Math.max(...es.map(e=>+(e.stats||{})[de]||0));
      const v=+(top.stats||{})[dk]||0;
      if(de && v>0 && maxD>0 && (+(top.stats||{})[de]||0)===maxD && (!glass||v>glass.v)) glass={v,pid:top.pid,m,pick:top.pick};
      for(const e of es){ const d=+(e.stats||{})[dk]||0; if(d>0 && (!paci||d<paci.v)) paci={v:d,pid:e.pid,m,pick:e.pick}; }
    }
    if(glass) out.push({...glass, title:"Glass Cannon", sub:"Top damage and most deaths in the same game", value:glass.v.toLocaleString()});
    if(paci) out.push({...paci, title:"Pacifist", sub:"Lowest damage in one game", value:paci.v.toLocaleString()});
  }
  if(g.pickLabel){
    const seen={}; for(const m of ms) for(const e of m.entries||[]) if(e.pick){ (seen[e.pid] ??= new Set()).add(e.pick.trim().toLowerCase()); }
    let best=null; for(const [pid,set] of Object.entries(seen)) if(!best||set.size>best.v) best={v:set.size,pid};
    if(best && best.v>1){ const last=ms.find(m=>(m.entries||[]).some(e=>e.pid===best.pid)); out.push({...best, m:last, title:"Champion Roulette", sub:`Different ${lc(g.pickLabel)}s played`, value:String(best.v), noDate:true}); }
  }
  const shame=out.filter(r=>r.shame); return out.filter(r=>!r.shame).concat(shame);
}
function augmentStats(ms){
  const A={};
  for(const m of ms) for(const e of m.entries||[]) for(const a of e.augments||[]){
    const k=a.toLowerCase(); const x=A[k] ??= {name:a,games:0,wins:0}; x.games++; if(e.team===m.winner || +e.place===1) x.wins++;
  }
  return Object.values(A);
}
function pentas(ms){
  const out=[]; for(const m of ms) for(const e of m.entries||[]){ const n=+(e.multi||{}).penta||0; if(n>0) out.push({pid:e.pid,pick:e.pick,m,n}); }
  return out;
}
/* trophies: winner of each finished tournament, per game */
function trophies(){
  const T={};
  for(const [gid,g] of Object.entries(S.games)){
    const seasons=[...new Set(S.matches.filter(m=>m.game===gid).map(m=>m.season))].filter(se=>/^\d{4}$/.test(se) && se<YEAR);
    for(const se of seasons){
      const top=aggregate(g, S.matches.filter(m=>m.game===gid && m.season===se))[0];
      if(top) (T[top.pid] ??= []).push({label:se, title:`${se} ${g.name} champion`});
    }
  }
  for(const m of S.matches){ const g=S.games[m.game]; if(!g?.multikills) continue; for(const e of m.entries||[]) if(+(e.multi||{}).penta>0){ const t=(T[e.pid] ??= []); if(!t.some(x=>x.penta)) t.push({penta:true,label:"Penta",title:"Has a pentakill"}); } }
  return T;
}
function badges(pid){
  const t=(S._trophies||{})[pid]; if(!t) return "";
  return t.map(x=>x.penta?`<span class="tag penta" title="${esc(x.title)}">Penta</span>`:`<span class="tag trophy" title="${esc(x.title)}">${TROPHY_ICON}${esc(x.label)}</span>`).join(" ");
}

/* ---------- people ---------- */
function myPlayer(){ if(!S.me?.id) return null; return Object.entries(S.players).find(([,p])=>p.uid===S.me.id)?.[0] || null; }
function pName(pid){ return S.players[pid]?.tag || "Removed player"; }
function avatar(pid, cls="av"){
  const p=S.players[pid];
  if(p?.avatar && /^https:\/\/cdn\.discordapp\.com\//.test(p.avatar)) return `<img class="${cls}" src="${esc(p.avatar)}" alt="">`;
  const t=((p?.tag||"?").trim()[0]||"?").toUpperCase();
  let h=0; for(const c of (p?.tag||"?")) h=(h*31+c.charCodeAt(0))%100003; h=(h*137)%360;
  return `<span class="${cls} av-txt" style="background:hsl(${h} 45% 26%);color:hsl(${h} 85% 82%)">${esc(t)}</span>`;
}
function plLink(pid){ return `<span class="pl">${avatar(pid)}<button data-act="view-player" data-pid="${esc(pid)}">${esc(pName(pid))}</button>${pid===myPlayer()?' <span class="tag you">You</span>':""}${badges(pid)?" "+badges(pid):""}</span>`; }
function computeAccess(){
  const mine=myPlayer();
  S.canWrite = S.isAdmin || !!(mine && S.players[mine].approved);
}

/* ---------- render ---------- */
function render(){
  const app=$("#app"); if(!app) return;
  const a=document.activeElement, aid=a&&a.id, sel=(a&&"selectionStart" in a)?[a.selectionStart,a.selectionEnd]:null;
  S._trophies = S.ready ? trophies() : {};
  app.innerHTML = header() + body() + ceremony() + statCard() + clipMaker();
  afterRender();
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
}
function header(){
  const g=G();
  const gameChips = Object.entries(S.games).sort((a,b)=>(a[1].order||0)-(b[1].order||0))
    .map(([id,x])=>`<button class="chip" data-act="game" data-id="${esc(id)}" aria-pressed="${id===S.gameId}">${esc(x.name)}</button>`).join("");
  const seasons=new Set([YEAR]); S.matches.forEach(m=>{ if(m.game===S.gameId && m.season) seasons.add(m.season); });
  const seasonOpts=[...seasons].sort().reverse().map(s=>`<option value="${esc(s)}"${s===S.season?" selected":""}>${esc(s)}</option>`).join("")+`<option value="all"${S.season==="all"?" selected":""}>All time</option>`;
  const who = !S.authReady ? "" : S.me?.id
    ? `<span class="who">${S.me.avatar?`<img class="av" src="${esc(S.me.avatar)}" alt="">`:""}${esc(S.me.name||"Signed in")}${S.isAdmin?' <span class="tag you">Organiser</span>':""} <button class="link" data-act="logout">Log out</button></span>`
    : `<button class="btn discord" data-act="login">${DISCORD_ICON}Log in with Discord</button>`;
  return `<header class="top">
    <div class="hero"><img class="logo" src="logo.jpg" alt="" width="720" height="686"><h1 class="sr-only">Rage Quit Rumble</h1>
      <div class="hero-side"><div class="who-row">${who}</div>
        <p class="tagline">The annual friends' showdown<b>${esc(S.season==="all"?"All time":S.season)}</b></p>
        ${S.ready && Object.keys(S.games).length ? `<div class="controls"><div class="chips" role="group" aria-label="Game">${gameChips}</div>
        <label class="season"><span class="label">Tournament</span><select id="season" data-act="season">${seasonOpts}</select></label></div>` : ""}
      </div></div>
    <nav class="tabs" role="tablist">${TABS.map(([id,l])=>`<button role="tab" data-act="tab" data-id="${id}" aria-selected="${S.tab===id}">${l}</button>`).join("")}</nav>
  </header>`;
}
function body(){
  if(S.noDb) return `<div class="panel empty"><h2>The scoreboard isn't connected yet</h2><p>Fill in config.js with your Supabase project URL and anon key. The README has the steps.</p></div>`;
  if(!S.ready) return `<div class="panel empty"><p>Loading scores…</p></div>`;
  let banner="";
  const mine=myPlayer();
  if(S.authReady && !S.me?.id) banner=`<div class="banner"><span>Log in with Discord to join the roster and log matches.</span><button class="btn discord small" data-act="login">${DISCORD_ICON}Log in with Discord</button></div>`;
  else if(S.me?.id && !mine && !S.isAdmin && S.tab!=="players") banner=`<div class="banner"><span>You're not on the roster yet. Join with your Discord name so your matches count.</span><button class="btn primary small" data-act="tab" data-id="players">Join the roster</button></div>`;
  else if(mine && !S.players[mine].approved && !S.isAdmin) banner=`<div class="banner"><span>You're on the roster. The organiser needs to approve you before you can log matches.</span></div>`;
  else if(S.isAdmin){ const n=Object.values(S.players).filter(p=>p.uid&&!p.approved).length; if(n && S.tab!=="players") banner=`<div class="banner"><span>${n} player${n===1?" is":"s are"} waiting for your approval.</span><button class="btn primary small" data-act="tab" data-id="players">Review</button></div>`; }
  const g=G();
  if(!g && S.tab!=="games") return banner+`<div class="panel empty"><h2>No games set up yet</h2><p>Add the first game for this year's tournament.</p>${S.isAdmin?`<button class="btn primary" data-act="tpl" data-id="aram">Add ARAM Mayhem</button>`:""}</div>`;
  return banner + ({standings,matches:matchesTab,players:playersTab,games:gamesTab}[S.tab])();
}

function standings(){
  const g=G(), ms=filtered(), rows=aggregate(g,ms);
  const seasonTxt = S.season==="all" ? "all tournaments" : S.season+" tournament";
  if(!rows.length) return `<div class="panel empty"><h2>No ${esc(g.name)} matches in the ${esc(seasonTxt)} yet</h2><p>Log the first match and the standings fill in.</p>${S.canWrite?`<div class="btn-row"><button class="btn primary" data-act="new-match">Log a match</button>${replayOk()?REPLAY_BTN:""}</div>`:""}</div>`;
  const ffa=g.format==="ffa";
  const table = `<div class="tbl-wrap"><table><thead><tr><th class="l">#</th><th class="l">Player</th><th>Played</th><th>W</th><th>L</th><th>Win %</th>${g.kda?"<th>KDA</th>":""}${ffa?"<th>Avg place</th>":""}${g.mvpStat?"<th>MVP</th>":""}<th>Points</th><th class="l">Last 5</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${i===0?"lead":""}"><td class="rank">${i+1}</td><td class="l">${plLink(r.pid)}${formIcon(g,r.pid)}</td><td>${r.games}</td><td>${r.wins}</td><td>${r.losses}</td><td>${pct(r.wins,r.games)}</td>${g.kda?`<td>${fmt1(r.kda)}</td>`:""}${ffa?`<td>${fmt1(r.placeSum/r.games)}</td>`:""}${g.mvpStat?`<td>${r.mvps}</td>`:""}<td class="pts">${r.pts}</td><td class="l"><span class="form">${r.form.map(w=>`<span class="pip ${w?"w":"l"}">${w?"W":"L"}</span>`).join("")}</span></td></tr>`).join("")}
  </tbody></table></div>`;
  const recs=records(g,ms);
  const podium = rows.length>=2 ? `<div class="podium">${[1,0,2].map(i=>rows[i]?`<div class="pod p${i+1}"><span class="place">#${i+1}</span>${avatar(rows[i].pid)}<button class="link name" data-act="view-player" data-pid="${esc(rows[i].pid)}" style="color:var(--ink)">${esc(pName(rows[i].pid))}</button><span class="pts num">${rows[i].pts}</span><span class="muted num" style="font-size:.8rem">${rows[i].wins}W ${rows[i].losses}L${g.kda?" · "+fmt1(rows[i].kda)+" KDA":""}</span></div>`:"<div></div>").join("")}</div>` : "";
  const p=g.points||{};
  const rules = ffa ? `Points by finishing place: ${(p.placements||[]).map((v,i)=>`${i+1}${["st","nd","rd"][i]||"th"} ${v}`).join(", ")}.` : `Win ${p.win??3} pts, loss ${p.loss??0}.`;
  const mvpRule = (g.mvpStat && p.mvp ? ` MVP (highest ${g.mvpStat==="kda"?"KDA":esc(statLabel(g,g.mvpStat))} in the match) gets +${p.mvp}.` : "")
    + (g.multikills && p.multi ? ` Triple kill +${p.multi.triple||0}, quadra +${p.multi.quadra||0}, penta +${p.multi.penta||0}.` : "");
  const ps = g.multikills ? pentas(ms) : [];
  const hof = g.multikills ? `<section class="panel"><h2>Pentakill Hall of Fame</h2>${ps.length?`<div class="hof">${ps.map(x=>`<div class="line"><span class="who2">${plLink(x.pid)} ${x.pick?`<span class="pick">${esc(x.pick)}</span>`:""}${x.n>1?` <b>×${x.n}</b>`:""}</span><span class="muted">${esc(fmtDate(x.m.playedAt))}</span></div>`).join("")}</div>`:`<p class="muted" style="margin:0">No pentakills yet. Somebody get one.</p>`}</section>` : "";
  const aug = g.augments ? augmentStats(ms) : [];
  const augPanel = g.augments ? `<section class="panel"><h2>Augments</h2>${aug.length?(()=>{
      const top=[...aug].sort((a,b)=>b.games-a.games||b.wins/b.games-a.wins/a.games).slice(0,5);
      const cursed=aug.filter(a=>a.games>=2).sort((a,b)=>a.wins/a.games-b.wins/b.games||b.games-a.games)[0];
      return `<div class="tbl-wrap"><table class="mini"><thead><tr><th class="l">Augment</th><th>Picked</th><th>Win %</th></tr></thead><tbody>${top.map(a=>`<tr><td class="l">${esc(a.name)}</td><td>${a.games}</td><td>${pct(a.wins,a.games)}</td></tr>`).join("")}</tbody></table></div>${cursed&&cursed.wins/cursed.games<.5?`<p style="margin:0"><span class="tag loss">Cursed</span> ${esc(cursed.name)} has won ${pct(cursed.wins,cursed.games)} of ${cursed.games} games.</p>`:""}`;
    })():`<p class="muted" style="margin:0">Log augments with each match to see which ones win.</p>`}</section>` : "";
  return `<div class="grid2">
    <section class="panel"><div class="panel-head"><h2>${esc(g.name)} standings</h2><span class="muted num">${ms.length} match${ms.length===1?"":"es"} · ${esc(seasonTxt)}</span></div>${podium}${table}<p class="muted" style="margin:0;font-size:.85rem">${rules}${mvpRule}</p></section>
    <section class="panel"><h2>Records</h2><div class="records">${recs.length?recs.map(r=>`<div class="rec${r.shame?" shame":""}"><span class="big num">${esc(r.value)}</span><span class="what"><b>${esc(r.title)}</b><span>${esc(pName(r.pid))}${r.pick&&!r.noDate?" · "+esc(r.pick):""}${r.noDate?" · "+esc(r.sub):" · "+esc(fmtDate(r.m.playedAt))}</span></span>${avatar(r.pid)}</div>`).join(""):`<p class="muted">Records appear once matches have stats.</p>`}</div></section>
  </div>${shamePanel(ms)}${hof||augPanel?`<div class="grid2" style="margin-top:20px">${augPanel||"<div></div>"}${hof}</div>`:""}`;
}
const lc = l => l===l.toUpperCase() ? l : l.toLowerCase();
function statLabel(g,key){ return (g.stats||[]).find(s=>s.key===key)?.label || key; }
function statLine(g,s){
  s=s||{};
  if(g.kda) { const rest=(g.stats||[]).filter(st=>![g.kda.k,g.kda.d,g.kda.a].includes(st.key)); return `${+s[g.kda.k]||0}/${+s[g.kda.d]||0}/${+s[g.kda.a]||0}`+rest.map(st=>` · ${big(s[st.key])} ${esc(st.label)}`).join(""); }
  return (g.stats||[]).map(st=>`${big(s[st.key])} ${esc(st.label)}`).join(" · ");
}

function matchesTab(){
  const g=G(), ms=filtered();
  const form = S.form ? logForm() : "";
  const list = ms.length ? ms.map(m=>matchCard(g,m)).join("") : `<div class="empty"><p>No matches logged for this tournament yet.</p></div>`;
  return `${form}<section class="panel bare"><div class="panel-head"><h2>Match history</h2>${S.canWrite&&!S.form?`<div class="btn-row">${replayOk()?REPLAY_BTN:""}<button class="btn primary" data-act="new-match">Log a match</button></div>`:""}</div>${list}</section>`;
}
function shortNum(v){ v=+v||0; return v>=10000?(v/1000).toFixed(v>=100000?0:1).replace(/\.0$/,"")+"k":nf(v); }
function nameBtn(pid){ return `<button class="nm" data-act="view-player" data-pid="${esc(pid)}">${esc(pName(pid))}</button>${pid===myPlayer()?'<span class="you-dot" title="You"></span>':""}`; }
function matchCard(g,m){
  const mvp=mvpOf(g,m), es=m.entries||[];
  const del = S.canWrite ? (S.confirmDel===m.id ? `<span class="btn-row"><button class="btn danger small" data-act="del-match" data-id="${esc(m.id)}">Delete match</button><button class="btn small" data-act="cancel-del">Keep</button></span>` : `<button class="icon-btn" data-act="ask-del" data-id="${esc(m.id)}" title="Delete match" aria-label="Delete match">🗑</button>`) : "";
  const hasFun=es.some(e=>e.fun), open=!!S.openMatch?.[m.id];
  const secs=hasFun?Math.max(...es.map(e=>e.fun?.time||0)):0;
  const meta=[fmtDate(m.playedAt), secs?`${Math.floor(secs/60)}:${String(Math.round(secs%60)).padStart(2,"0")}`:"", m.note||""].filter(Boolean);
  const head=`<header class="mh"><div class="mh-l"><span class="mh-meta">${meta.map(esc).join('<i>•</i>')}</span>${headline(m)}</div>
    <div class="mh-r">${!S.commentsOff&&S.canWrite?`<button class="icon-btn chat" data-act="talk-open" data-id="${esc(m.id)}" title="Talk trash" aria-label="Talk trash">💬${(()=>{const n=S.comments.filter(c=>c.match_id===m.id).length;return n?`<span>${n}</span>`:"";})()}</button>`:""}${S.canWrite&&!S.clipsOff?`<button class="icon-btn chat" data-act="clip-open" data-id="${esc(m.id)}" title="Add voice clips" aria-label="Add voice clips">🎙</button>`:""}${hasFun||clipsFor(m.id).length?`<button class="btn small primary" data-act="show" data-id="${esc(m.id)}">▶ Awards</button>`:""}
    ${hasFun||es.some(e=>(e.augments||[]).length)?`<button class="btn small" data-act="toggle-match" data-id="${esc(m.id)}" aria-expanded="${open}">${open?"Less":"More"}</button>`:""}${del}</div></header>`;
  if(g.format==="ffa"){
    const rows=[...es].sort((a,b)=>(+a.place||99)-(+b.place||99));
    return `<article class="match">${head}<div class="sb"><div class="sb-team">${rows.map(e=>`<div class="sb-row"><span class="sb-place num">${+e.place||"–"}</span>${avatar(e.pid)}<div class="sb-name">${nameBtn(e.pid)}${e.pick?`<span class="sb-champ">${esc(e.pick)}</span>`:""}</div><div class="sb-stats num">${statLine(g,e.stats)}</div></div>`).join("")}</div></div>${clipStrip(m)}${penaltyBar(g,m)}${talk(m)}</article>`;
  }
  const dk=g.dmgStat, dmax=Math.max(1,...es.map(e=>+e.stats?.[dk]||0));
  const q=teamQuirks(m);
  const multi=e=>{ const mu=e.multi||{}; const k=["penta","quadra","triple"].find(k=>+mu[k]>0); return k?`<span class="mk mk-${k}" title="${MULTI.find(x=>x[0]===k)[1]} kill">${k==="penta"?"PENTA":k==="quadra"?"QUADRA":"TRIPLE"}${+mu[k]>1?"×"+(+mu[k]):""}</span>`:""; };
  const row=e=>{ const s=e.stats||{};
    return `<div class="sb-row${mvp===e.pid&&g.mvpStat?" is-mvp":""}">${avatar(e.pid)}
      <div class="sb-name">${nameBtn(e.pid)}${mvp===e.pid&&g.mvpStat?'<span class="mvp-chip">MVP</span>':""}${multi(e)}<span class="sb-champ">${esc(e.pick||"")}</span></div>
      ${g.kda?`<div class="sb-kda num">${+s[g.kda.k]||0}<i>/</i><b>${+s[g.kda.d]||0}</b><i>/</i>${+s[g.kda.a]||0}</div>`:`<div class="sb-stats num">${statLine(g,s)}</div>`}
      ${dk?`<div class="sb-dmg" title="${nf(s[dk])} ${esc(statLabel(g,dk))}"><span class="num">${shortNum(s[dk])}</span><span class="bar"><i style="width:${Math.round((+s[dk]||0)/dmax*100)}%"></i></span></div>`:""}
      ${open&&((e.augments||[]).length||(g.healStat&&+s[g.healStat]))?`<div class="sb-more">${g.healStat?`<span>🩹 ${nf(s[g.healStat])} healing</span>`:""}${(e.augments||[]).map(a=>`<span class="aug">${esc(a)}</span>`).join("")}</div>`:""}
    </div>`; };
  const team=t=>{ const won=m.winner===t, qs=q[t];
    return `<div class="sb-team ${won?"won":"lost"}"><div class="sb-th"><span class="res">${won?"Victory":"Defeat"}</span><span class="tn">Team ${t}</span>
      ${qs.length?`<span class="quirk" title="${esc(qs[0].why)}">${qs[0].icon} ${esc(qs[0].label)}</span>`:""}
      ${dk?`<span class="th-dmg">${esc(statLabel(g,dk))}</span>`:""}</div>
      ${es.filter(e=>e.team===t).map(row).join("")}
      ${open&&qs.length>1?`<div class="quirks">${qs.slice(1).map(x=>`<span class="quirk" title="${esc(x.why)}">${x.icon} ${esc(x.label)} <small>${esc(x.show)}</small></span>`).join("")}</div>`:""}
    </div>`; };
  return `<article class="match">${head}<div class="sb">${team("A")}${team("B")}</div>${highlights(g,m)}${clipStrip(m)}${penaltyBar(g,m)}${talk(m)}</article>`;
}
function highlights(g,m){
  const rs=roastsFor(m,3); if(!rs.length) return "";
  return `<div class="hl">${rs.map(x=>{ const c=roastCard(x); return `<div class="hl-tile"><span class="hl-ico">${c.icon}</span><span class="hl-txt"><span class="hl-t">${esc(c.title)}</span><span class="hl-w"><b>${esc(pName(c.pid))}</b> · ${esc(c.fmt==="text"?c.text:fmtBig(c.num,c.fmt))} ${esc(c.unit)}</span></span></div>`; }).join("")}</div>`;
}
function talkAuthor(uid){ const pid=Object.keys(S.players).find(id=>S.players[id].uid===uid); return pid; }
function talk(m){
  if(S.commentsOff) return "";
  const cs=S.comments.filter(c=>c.match_id===m.id);
  const open=S.canWrite && (S.talkOpen?.[m.id] || S.cdraft[m.id]);
  if(!cs.length && !open) return "";
  const lines=cs.map(c=>{ const pid=talkAuthor(c.author); const mine=S.me?.id===c.author;
    return `<div class="talk-line">${pid?avatar(pid):'<span class="av av-txt">?</span>'}<span class="body"><b>${esc(pid?pName(pid):"Someone")}</b> ${esc(c.body)}</span>${mine||S.isAdmin?`<button class="link x" data-act="del-talk" data-id="${esc(c.id)}">Delete</button>`:""}</div>`; }).join("");
  const form = open ? `<div class="talk-form"><input id="c-${esc(m.id)}" data-bind="cdraft.${esc(m.id)}" value="${esc(S.cdraft[m.id]||"")}" maxlength="280" placeholder="Talk some trash…" aria-label="Comment on this match"><button class="btn small" data-act="post-talk" data-id="${esc(m.id)}">Post</button></div>` : "";
  return `<div class="talk">${lines}${form}</div>`;
}

/* ---------- log form ---------- */
function newForm(){
  const g=G(), n=Math.max(1,Math.min(20,+g.teamSize||5));
  const rows=[];
  if(g.format==="ffa") for(let i=0;i<Math.min(n,8);i++) rows.push({side:"",pid:"",pick:"",place:String(i+1),stats:{},augments:"",multi:{}});
  else for(const side of ["A","B"]) for(let i=0;i<n;i++) rows.push({side,pid:"",pick:"",place:"",stats:{},augments:"",multi:{}});
  const me=myPlayer(); if(me) rows[0].pid=me;
  return {game:S.gameId, season:S.season==="all"?YEAR:S.season, date:today(), winner:"A", note:"", rows};
}
function logForm(){
  const g=S.games[S.form.game]||G(), f=S.form;
  const opts = (sel,hint) => `<option value="">${hint?"Who is "+esc(hint)+"?":"Choose player…"}</option>`+Object.entries(S.players).sort((a,b)=>a[1].tag.localeCompare(b[1].tag)).map(([id,p])=>`<option value="${esc(id)}"${id===sel?" selected":""}>${esc(p.tag)}</option>`).join("");
  const cols = `minmax(130px,1.6fr) ${g.pickLabel?"minmax(100px,1.2fr) ":""}${g.format==="ffa"?"64px ":""}${(g.stats||[]).map(s=>s.key===g.dmgStat||s.key===g.healStat?"minmax(72px,.8fr)":"minmax(54px,.6fr)").join(" ")}${g.multikills?" 54px 54px 54px":""}${g.augments?" minmax(180px,2fr)":""}`;
  const head = `<div class="roster-row roster-head" style="grid-template-columns:${cols}"><span>Player</span>${g.pickLabel?`<span>${esc(g.pickLabel)}</span>`:""}${g.format==="ffa"?"<span>Place</span>":""}${(g.stats||[]).map(s=>`<span>${esc(s.label)}</span>`).join("")}${g.multikills?MULTI.map(([,l])=>`<span>${l}</span>`).join(""):""}${g.augments?"<span>Augments (comma separated)</span>":""}</div>`;
  const rowHtml = (r,i) => `<div class="roster-row" style="grid-template-columns:${cols}">
      <div class="pid-cell"><select id="f-${i}-pid" data-bind="form.rows.${i}.pid" data-rerender="1" aria-label="Player"${r.riot?` title="In the replay: ${esc(r.riot)}"`:""}>${opts(r.pid,r.riot)}</select>${r.riot&&!r.pid&&S.isAdmin?`<button class="btn small add-riot" data-act="add-riot" data-i="${i}" title="Add ${esc(r.riot)} to the roster" aria-label="Add ${esc(r.riot)} to the roster">+</button>`:""}</div>
      ${g.pickLabel?`<input id="f-${i}-pick" data-bind="form.rows.${i}.pick" value="${esc(r.pick)}" placeholder="${esc(g.pickLabel)}" aria-label="${esc(g.pickLabel)}">`:""}
      ${g.format==="ffa"?`<input id="f-${i}-place" type="number" min="1" inputmode="numeric" data-bind="form.rows.${i}.place" value="${esc(r.place)}" aria-label="Place">`:""}
      ${(g.stats||[]).map(s=>`<input id="f-${i}-${esc(s.key)}" type="number" min="0" inputmode="numeric" data-bind="form.rows.${i}.stats.${esc(s.key)}" value="${esc(r.stats[s.key]??"")}" placeholder="0" aria-label="${esc(s.label)}">`).join("")}
      ${g.multikills?MULTI.map(([k,l])=>`<input id="f-${i}-m-${k}" type="number" min="0" inputmode="numeric" data-bind="form.rows.${i}.multi.${k}" value="${esc(r.multi?.[k]??"")}" placeholder="0" aria-label="${l} kills">`).join(""):""}
      ${g.augments?`<input id="f-${i}-aug" data-bind="form.rows.${i}.augments" value="${esc(r.augments||"")}" placeholder="e.g. Tank Engine, Goliath" aria-label="Augments">`:""}
    </div>`;
  const rosterScroll = inner => `<div class="tbl-wrap"><div class="roster" style="min-width:${(g.pickLabel?240:130)+(g.format==="ffa"?70:0)+(g.stats||[]).length*72+(g.multikills?180:0)+(g.augments?190:0)}px">${inner}</div></div>`;
  let roster;
  if(g.format==="ffa"){
    roster = `<div class="team-block">${rosterScroll(head+f.rows.map(rowHtml).join(""))}<div><button class="btn small" data-act="add-row" data-side="">Add player</button></div></div>`;
  } else {
