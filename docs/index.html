      ${rosterScroll(head+f.rows.map((r,i)=>r.side===t?rowHtml(r,i):"").join(""))}<div><button class="btn small" data-act="add-row" data-side="${t}">Add player</button></div></div>`).join("");
  }
  return `<section class="panel logform"><div class="panel-head"><h2>New ${esc(g.name)} match</h2><div class="btn-row">${replayOk(g)?REPLAY_BTN.replace('class="btn"','class="btn small"'):""}<button class="btn small" data-act="cancel-form">Cancel</button></div></div>
    ${f.replay?`<p class="banner" style="margin:0">${esc(f.replay)}</p>`:""}
    <div class="row-fields">
      <label class="field"><span class="label">Date played</span><input id="f-date" type="date" data-bind="form.date" value="${esc(f.date)}"></label>
      <label class="field"><span class="label">Tournament</span><input id="f-season" data-bind="form.season" value="${esc(f.season)}" style="width:7em"></label>
      <label class="field" style="flex:1 1 220px"><span class="label">Note (optional)</span><input id="f-note" data-bind="form.note" value="${esc(f.note)}" placeholder="e.g. Semi-final, game 2"></label>
    </div>
    ${Object.keys(S.players).length<2?`<p class="banner" style="margin:0">Add at least two players on the Players tab before logging a match.</p>`:""}
    ${roster}
    <p class="muted" style="margin:0;font-size:.85rem">Leave unused rows blank. ${g.kda?"KDA and MVP are worked out from the stats.":""}</p>
    ${S.formErr?`<p class="err" role="alert" style="margin:0">${esc(S.formErr)}</p>`:""}
    <div><button class="btn primary" data-act="save-match"${S.busy?" disabled":""}>Save match</button></div>
  </section>`;
}
function buildMatch(){
  const f=S.form, g=S.games[f.game];
  const rows=f.rows.filter(r=>r.pid);
  if(rows.length<(f.replay?1:2)) return f.replay?"Pick who you are in the replay (or press + next to a name).":"Pick at least two players.";
  const ids=rows.map(r=>r.pid); if(new Set(ids).size!==ids.length) return "Each player can only appear once in a match.";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return "Choose the date the match was played.";
  if(!f.season.trim()) return "Fill in which tournament this match belongs to, for example "+YEAR+".";
  if(g.format==="ffa"){ if(rows.some(r=>!(+r.place>=1))) return "Give every player a finishing place."; }
  else if(!f.replay){ if(!rows.some(r=>r.side==="A")||!rows.some(r=>r.side==="B")) return "Both teams need at least one player."; }
  const entries=rows.map(r=>{
    const e={pid:r.pid, stats:{}};
    if(g.format==="ffa") e.place=+r.place; else e.team=r.side;
    if(r.pick && r.pick.trim()) e.pick=r.pick.trim().slice(0,40);
    if(r.riot) e.riot=String(r.riot).slice(0,40);
    if(r.fun){ const fu={}; for(const k of FUN_KEYS) fu[k]=Math.max(0,Math.round(+r.fun[k]||0)); e.fun=fu; }
    for(const s of g.stats||[]) e.stats[s.key]=Math.max(0,Math.round(+r.stats[s.key]||0));
    if(g.multikills){ const mu={}; for(const [k] of MULTI){ const v=Math.max(0,Math.round(+(r.multi||{})[k]||0)); if(v) mu[k]=v; } if(Object.keys(mu).length) e.multi=mu; }
    if(g.augments && r.augments){ const a=r.augments.split(",").map(x=>x.trim().slice(0,40)).filter(Boolean).slice(0,6); if(a.length) e.augments=a; }
    return e;
  });
  const doc={game:f.game, season:f.season.trim().slice(0,20), playedAt:f.date+new Date().toISOString().slice(10), entries, loggedBy:S.me?.id||null, createdAt:new Date().toISOString()};
  if(g.format!=="ffa") doc.winner=f.winner;
  if(f.note.trim()) doc.note=f.note.trim().slice(0,80);
  return doc;
}



/* ---------- roasts (from replay stats) ---------- */
const FUN_KEYS=["time","dead","alive","tower","reroll","pings","unspent","mitig","flash","cc","dc","snow","spells","left","ff"];
const mmss=s=>{ s=Math.round(+s||0); const m=Math.floor(s/60); return m?`${m}m ${String(s%60).padStart(2,"0")}s`:`${s}s`; };
const nf=v=>Math.round(+v||0).toLocaleString("en-GB");
function fmtBig(n,fmt){ return fmt==="time"?mmss(n):fmt==="pct"?Math.round(n)+"%":fmt==="dec"?(+n).toFixed(1):nf(n); }
// pick: "max" or "min"; ok: worth a roast; big: [number, format] shown on the card
const ROASTS=[
  {key:"left", icon:"🚪", title:"Rage Quitter", pick:"max", ok:v=>v>0, big:()=>[0,"text","QUIT"], unit:"left the game", quip:()=>"Living up to the tournament name."},
  {key:"dc", icon:"📡", title:"Wi-Fi Warrior", pick:"max", ok:v=>v>=5, big:v=>[v,"time"], unit:"disconnected", quip:()=>"Router problems, or tactical?"},
  {key:"deadPct", icon:"🪦", title:"Grey Screen Enjoyer", pick:"max", ok:v=>v>=.25, big:v=>[v*100,"pct"], unit:"of the game spent dead", quip:f=>`${mmss(f.dead)} of grey screen. Knows every pixel.`},
  {key:"alive", icon:"🦟", title:"Mayfly", pick:"min", ok:v=>v>0&&v<=85, big:v=>[v,"time"], unit:"longest life", quip:()=>"Blink and you'd miss it."},
  {key:"tower", icon:"🏰", title:"Tower Hugger", pick:"max", ok:v=>v>=1500, big:v=>[v,"int"], unit:"tower damage taken", quip:()=>"They do hurt, it turns out."},
  {key:"reroll", icon:"🎰", title:"Commitment Issues", pick:"max", ok:v=>v>=10, big:v=>[v,"int"], unit:"augment rerolls", quip:()=>"Still wasn't happy."},
  {key:"pings", icon:"📢", title:"Keyboard Warrior", pick:"max", ok:v=>v>=35, big:v=>[v,"int"], unit:"pings", quip:()=>"We heard you the first time."},
  {key:"unspent", icon:"💰", title:"Scrooge", pick:"max", ok:v=>v>=1500, big:v=>[v,"int"], unit:"gold never spent", quip:()=>"Saving up for something?"},
  {key:"mitig", icon:"🥊", title:"Human Punching Bag", pick:"max", ok:v=>v>=40000, big:v=>[v,"int"], unit:"damage soaked", quip:()=>"Took one for the team. Repeatedly."},
  {key:"cc", icon:"⛓️", title:"The Jailer", pick:"max", ok:v=>v>=30, big:v=>[v,"time"], unit:"of stuns and roots", quip:()=>"Nobody moves on their watch."},
  {key:"flashPm", icon:"⚡", title:"Flash Addict", pick:"max", ok:v=>v>=1, big:(v,f)=>[f.flash,"int"], unit:"summoner spells used", quip:()=>"Nobody needs that many."},
  {key:"snow", icon:"❄️", title:"Snowball Sniper", pick:"max", ok:v=>v>=8, big:v=>[v,"int"], unit:"snowballs landed", quip:()=>"Hexgate to the face."},
  {key:"spellsPm", icon:"⌨️", title:"Button Masher", pick:"max", ok:v=>v>=14, big:(v,f)=>[f.spells,"int"], unit:"spells cast", quip:()=>"The keyboard wants a lawyer."},
];
function funVal(key,f){
  const mins=Math.max(1,(f.time||0)/60);
  if(key==="deadPct") return f.time?f.dead/f.time:0;
  if(key==="flashPm") return f.flash/mins;
  if(key==="spellsPm") return f.spells/mins;
  return +f[key]||0;
}
function roastsFor(m, max=4){
  const es=(m.entries||[]).filter(e=>e.fun); if(!es.length) return [];
  const out=[], used=new Map();
  for(const r of ROASTS){
    const vals=es.map(e=>({e,v:funVal(r.key,e.fun)})).filter(x=>r.ok(x.v)); if(!vals.length) continue;
    vals.sort((a,b)=>r.pick==="min"?a.v-b.v:b.v-a.v);
    const best=vals.find(x=>!used.get(x.e.pid)) || vals[0];
    out.push({r, e:best.e, v:best.v, again:!!used.get(best.e.pid)}); used.set(best.e.pid,1);
  }
  out.sort((a,b)=>a.again-b.again);
  return out.slice(0,max);
}
function champArt(pick){ const id=String(pick||"").replace(/[^A-Za-z]/g,""); return id?`https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${id}_0.jpg`:""; }
function roastCard(x){
  const [n,fmt,txt]=x.r.big(x.v,x.e.fun);
  return {tone:"shame", icon:x.r.icon, title:x.r.title, pid:x.e.pid, pick:x.e.pick, num:n, fmt, text:txt, unit:typeof x.r.unit==="function"?x.r.unit(x.e.fun):x.r.unit, quip:x.r.quip(x.e.fun)};
}
function gloryCards(g,m){
  const es=m.entries||[], out=[];
  const mvp=mvpOf(g,m), e=es.find(x=>x.pid===mvp);
  if(e && g.kda){ const s=e.stats||{}; out.push({tone:"glory", icon:"👑", title:"MVP", pid:e.pid, pick:e.pick, num:kdaVal(g,s), fmt:"dec", unit:"KDA", quip:`${+s[g.kda.k]||0} / ${+s[g.kda.d]||0} / ${+s[g.kda.a]||0}${e.pick?" on "+e.pick:""}. Bow down.`}); }
  if(g.dmgStat){ const c=[...es].sort((a,b)=>(+b.stats?.[g.dmgStat]||0)-(+a.stats?.[g.dmgStat]||0))[0];
    if(c && c.pid!==mvp && +c.stats?.[g.dmgStat]>0) out.push({tone:"glory", icon:"💥", title:"The Carry", pid:c.pid, pick:c.pick, num:+c.stats[g.dmgStat], fmt:"int", unit:"damage to champions", quip:"Did the heavy lifting."}); }
  return out;
}
function awardCard(a, cls=""){

function awardStrip(g,m){
  const rs=roastsFor(m); if(!rs.length) return "";

}
function headline(m){
  const es=(m.entries||[]).filter(e=>e.fun); if(!es.length) return "";
  const t=Math.max(...es.map(e=>e.fun.time||0)), ff=es.find(e=>e.fun.ff);
  const loser=m.winner==="A"?"B":m.winner==="B"?"A":"";
  const mins=Math.round(t/60);
  let line;
  if(ff) line = mins<=15 ? `Team ${ff.team||loser} typed /ff after ${mins} minutes. Tactical retreat.` : `Team ${ff.team||loser} surrendered after ${mins} minutes.`;
  else if(mins && mins<=14) line=`Over in ${mins} minutes. That was a stomp.`;
  else if(mins>=25) line=`A ${mins}-minute marathon. Nobody wanted to lose this one.`;
  else return "";
  return `<p class="headline">${esc(line)}</p>`;
}

const QUIRKS=[

  {icon:"⛓️", label:"Crowd Control Crew", calc:es=>es.reduce((t,e)=>t+(+e.fun.cc||0),0), min:40, show:v=>mmss(v)+" of CC", why:"Nobody on the other side could move"},
  {icon:"🏰", label:"Tower Divers", calc:es=>es.reduce((t,e)=>t+(+e.fun.tower||0),0), min:3000, show:v=>nf(v)+" tower damage taken", why:"Fearless, or clueless"},
  {icon:"🎰", label:"Gamblers", calc:es=>es.reduce((t,e)=>t+(+e.fun.reroll||0),0), min:25, show:v=>nf(v)+" rerolls", why:"Never happy with an augment"},
  {icon:"💰", label:"Bankers", calc:es=>es.reduce((t,e)=>t+(+e.fun.unspent||0),0), min:3000, show:v=>nf(v)+" gold unspent", why:"Died rich"},
  {icon:"⚡", label:"Flash Mob", calc:es=>es.reduce((t,e)=>t+(+e.fun.flash||0),0), min:25, show:v=>nf(v)+" summoner spells", why:"Spell cooldowns? Never heard of them"},
];
function teamQuirks(m){
  const by={A:(m.entries||[]).filter(e=>e.team==="A"&&e.fun), B:(m.entries||[]).filter(e=>e.team==="B"&&e.fun)};
  const out={A:[],B:[]}; if(!by.A.length && !by.B.length) return out;
  for(const t of ["A","B"]) if(by[t].some(e=>e.fun.ff)) out[t].push({icon:"🏳️", label:"White Flag Wavers", show:"surrendered", why:"Pressed the button"});
  for(const q of QUIRKS){
    const a=by.A.length?q.calc(by.A):0, b=by.B.length?q.calc(by.B):0;
    if(Math.max(a,b)<q.min || a===b) continue;
    const t=a>b?"A":"B"; out[t].push({icon:q.icon, label:q.label, show:q.show(Math.max(a,b)), why:q.why});
  }
  return out;
}
function quirkChips(m,t){
  const qs=teamQuirks(m)[t].slice(0,3); if(!qs.length) return "";
  return `<div class="quirks">${qs.map(q=>`<span class="quirk" title="${esc(q.why)}">${q.icon} ${esc(q.label)} <small>· ${esc(q.show)}</small></span>`).join("")}</div>`;
}

/* ---------- awards ceremony ---------- */
function showSlides(m){
  const g=S.games[m.game]||G();
  const cards=[...gloryCards(g,m), ...roastsFor(m,8).map(roastCard)];
  const out=[{kind:"title"}, ...cards.map(c=>({kind:"card",c})), {kind:"quirks"}];
  if(clipsFor(m.id).length) out.push({kind:"clips"});
  const pen=penaltyFor(g,m); if(pen) out.push({kind:"penalty",pen});
  return out;
}
function ceremony(){
  if(!S.show) return "";
  const m=S.matches.find(x=>x.id===S.show.mid); if(!m){ S.show=null; return ""; }
  const g=S.games[m.game]||G(), slides=showSlides(m), i=Math.max(0,Math.min(S.show.i,slides.length-1)), sl=slides[i];
  let inner;
  if(sl.kind==="title"){
    const hl=headline(m).replace(/<[^>]+>/g,"");
    inner=`<div class="title-slide"><span class="kicker" style="font:700 .8rem var(--display);letter-spacing:.25em;color:var(--muted)">${esc(fmtDate(m.playedAt))}${m.note?" · "+esc(m.note):""}</span>
      <div class="big-t">The Roast</div>${m.winner?`<div class="result"><b>Team ${esc(m.winner)}</b> won</div>`:""}${hl?`<p class="headline" style="font-size:1.15rem">${hl}</p>`:""}
      <p class="muted" style="margin:0">${slides.filter(x=>x.kind==="card").length} awards to hand out. Press Next.</p></div>`;
  } else if(sl.kind==="card"){
    inner=awardCard(sl.c,"big reveal");
  } else if(sl.kind==="clips"){
    inner=`<div class="title-slide" style="width:min(560px,100%)"><div class="pen-jar">🎙</div><div class="big-t" style="font-size:clamp(1.8rem,6vw,3rem)">Comms highlights</div><div class="clip-stack">${clipsFor(m.id).map(c=>clipChip(c,true)).join("")}</div><p class="muted" style="margin:0">Press play. No context will be given.</p></div>`;
  } else if(sl.kind==="penalty"){
    inner=`<div class="title-slide"><div class="pen-jar">⚖️</div><div class="big-t" style="font-size:clamp(2rem,7vw,3.4rem)">Penalty jar</div>${avatar(sl.pen.pid)}<p class="pen-big">${esc(sl.pen.text)}</p><p class="muted" style="margin:0">No appeals. The jar has spoken.</p></div>`;
  } else {
    const q=teamQuirks(m);
    const col=t=>`<div class="col${m.winner===t?" won":""}"><h3>Team ${t} ${m.winner===t?'<span class="tag win">Won</span>':'<span class="tag loss">Lost</span>'}</h3>
      ${q[t].length?q[t].map(x=>`<div class="qrow"><span class="qi">${x.icon}</span><span style="min-width:0"><b>${esc(x.label)}</b><span>${esc(x.show)} · ${esc(x.why)}</span></span></div>`).join(""):`<p class="muted" style="margin:0">Suspiciously normal.</p>`}</div>`;
    inner=`<div style="display:grid;gap:16px;justify-items:center;width:100%"><div class="big-t" style="font:700 clamp(1.6rem,5vw,2.6rem) var(--display);text-transform:uppercase">Team quirks</div><div class="vs">${col("A")}${col("B")}</div></div>`;
  }
  const last=i===slides.length-1;
  const confetti = sl.kind==="card" && sl.c.tone==="glory" && S._shown!==S.show.mid+":"+i ? `<div class="confetti">${Array.from({length:40},(_,k)=>`<i style="left:${(k*97)%100}%;background:${["#ffc857","#4fd8ff","#9b7bff","#ff6b7d","#3ee09a"][k%5]};animation-duration:${1.6+(k%7)*.25}s;animation-delay:${(k%10)*.06}s"></i>`).join("")}</div>` : "";
  return `<div class="stage" data-act="show-close-bg"><div class="stage-box" role="dialog" aria-modal="true" aria-label="Awards ceremony">${confetti}
    <div class="stage-top"><span class="kicker">${esc(g.name)} · Awards ceremony</span><button class="btn small" data-act="show-close" aria-label="Close">✕ Close</button></div>
    <div class="stage-body" data-act="show-next">${inner}</div>
    <div class="stage-foot"><button class="btn" data-act="show-prev"${i===0?" disabled":""}>Back</button><span class="dots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</span><button class="btn primary" data-act="${last?"show-close":"show-next"}">${last?"Done":"Next"}</button></div>
  </div></div>`;
}
function showStep(d){
  if(!S.show) return;
  const m=S.matches.find(x=>x.id===S.show.mid); if(!m){ closeShow(); return; }
  const n=showSlides(m).length, i=S.show.i+d;
  if(i>=n){ closeShow(); return; }
  S.show.i=Math.max(0,i); render();
}
function closeShow(){ S.show=null; document.body.style.overflow=""; render(); }
function ceremonyKey(e){
  if(e.key==="Escape"){ closeShow(); return true; }
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); showStep(1); return true; }
  if(e.key==="ArrowLeft"){ showStep(-1); return true; }
  return false;
}
// count the big numbers up, once per ceremony slide
function afterRender(){
  if(!S.show) return;
  const key=S.show.mid+":"+S.show.i; if(S._shown===key) return; S._shown=key;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".stage [data-count]").forEach(el=>{
    const to=+el.dataset.count, fmt=el.dataset.fmt, t0=performance.now(), dur=1100;
    const tick=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmtBig(fmt==="dec"?to*e:Math.round(to*e),fmt); if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

/* ---------- hall of shame ---------- */
const SHAME=[
  {icon:"🪦", title:"Grey Screen Champion", calc:f=>f.dead, fmt:"time", unit:"spent dead", quip:"Total time dead this tournament."},
  {icon:"📢", title:"Keyboard Warrior", calc:f=>f.pings, fmt:"int", unit:"pings sent", quip:"Ping first, think later."},
  {icon:"🏰", title:"Tower Hugger", calc:f=>f.tower, fmt:"int", unit:"tower damage", quip:"Kept walking under towers."},
  {icon:"🎰", title:"Commitment Issues", calc:f=>f.reroll, fmt:"int", unit:"augment rerolls", quip:"Never happy with an augment."},
  {icon:"💰", title:"Scrooge", calc:f=>f.unspent, fmt:"int", unit:"gold never spent", quip:"Taking it to the grave."},
  {icon:"🥊", title:"Human Punching Bag", calc:f=>f.mitig, fmt:"int", unit:"damage soaked", quip:"Took one for the team, repeatedly."},

function shamePanel(ms){
  const tot={}, champs={};
  for(const m of ms) for(const e of m.entries||[]) if(e.fun){
    const t=(tot[e.pid] ??= {}); for(const k of FUN_KEYS) t[k]=(t[k]||0)+(+e.fun[k]||0);
    if(e.pick){ const c=(champs[e.pid] ??= {}); c[e.pick]=(c[e.pick]||0)+1; }
  }
  const ids=Object.keys(tot); if(!ids.length) return "";
  const fav=pid=>Object.entries(champs[pid]||{}).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
  const cards=SHAME.map(c=>{ const best=ids.map(id=>({id,v:c.calc(tot[id])})).sort((a,b)=>b.v-a.v)[0]; return best&&best.v>0?{tone:"shame",icon:c.icon,title:c.title,pid:best.id,pick:fav(best.id),num:best.v,fmt:c.fmt,unit:c.unit,quip:c.quip}:null; }).filter(Boolean);
  if(!cards.length) return "";

}

/* ---------- replay import (.rofl) ---------- */
const REPLAY_BTN = `<label class="btn" title="Fill the match in from a League of Legends .rofl replay">Upload replay<input type="file" accept=".rofl" data-act="rofl" hidden></label>`;
const AUG_URL = "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/cherry-augments.json";
let AUG_NAMES = null;
function replayOk(g=G()){ return !!g && g.format!=="ffa" && /league|lol|aram/i.test((g.name||"")+" "+(g.short||"")+" "+S.gameId); }
async function augNames(){
  if(AUG_NAMES) return AUG_NAMES;
  try{ const r=await fetch(AUG_URL); if(!r.ok) throw 0; const a=await r.json(); AUG_NAMES={}; for(const x of a) if(x && x.id!=null && x.nameTRA) AUG_NAMES[String(x.id)]=x.nameTRA; }
  catch(_){ return {}; }
  return AUG_NAMES;
}
// A .rofl ends with a JSON block of end-of-game stats: {"gameLength":…, "statsJson":"[…]"}
function parseRofl(buf){
  const b=new Uint8Array(buf);
  if(b.length<16 || b[0]!==82 || b[1]!==73 || b[2]!==79 || b[3]!==84) throw "That file isn't a League of Legends replay (.rofl).";
  const needle=[...'{"gameLength'].map(c=>c.charCodeAt(0)); let at=-1;
  outer: for(let i=b.length-needle.length;i>=0;i--){ for(let j=0;j<needle.length;j++) if(b[i+j]!==needle[j]) continue outer; at=i; break; }
  if(at<0) throw "Couldn't find the end-of-game stats in that replay. Was the game finished?";
  const txt=new TextDecoder("utf-8").decode(b.subarray(at, Math.min(b.length, at+2000000)));
  let depth=0, str=false, esc_=false, end=-1;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(str){ if(esc_) esc_=false; else if(c==="\\") esc_=true; else if(c==="\"") str=false; continue; }
    if(c==="\"") str=true; else if(c==="{") depth++; else if(c==="}" && --depth===0){ end=i+1; break; } }
  if(end<0) throw "The replay's stats block looks damaged.";
  const meta=JSON.parse(txt.slice(0,end));
  const players=typeof meta.statsJson==="string"?JSON.parse(meta.statsJson):meta.statsJson;
  if(!Array.isArray(players)||!players.length) throw "The replay has no player stats in it.";
  return {lengthMs:+meta.gameLength||0, players};
}
function rosterMatch(name, taken){
  const norm=x=>String(x||"").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
  const n=norm(name); if(!n) return "";
  for(const m of [...S.matches].sort((a,b)=>String(b.playedAt||b.played_at||"").localeCompare(String(a.playedAt||a.played_at||""))))
    for(const e of m.entries||[]) if(e.riot && norm(e.riot)===n && S.players[e.pid] && !taken.has(e.pid)) return e.pid;
  const ids=Object.keys(S.players).filter(id=>!taken.has(id));
  return ids.find(id=>norm(S.players[id].tag)===n)
      || ids.find(id=>{ const t=norm(S.players[id].tag); return t.length>=4 && n.length>=4 && (t.startsWith(n)||n.startsWith(t)); })
      || "";
}
async function importReplay(file){
  if(!S.canWrite) return;
  let rep;
  try{ rep=parseRofl(await file.arrayBuffer()); }
  catch(err){ toast(typeof err==="string"?err:"Couldn't read that replay."); return; }
  if(!S.form) S.form=newForm();
  const g=S.games[S.form.game]||G(), keys=new Set((g.stats||[]).map(s=>s.key));
  const names=g.augments?await augNames():{};
  const num=v=>Math.max(0,Math.round(+v||0));
  const taken=new Set(); let matched=0, winner="";
  const rows=rep.players.map(p=>{
    const side=String(p.TEAM)==="200"?"B":"A";
    if(p.WIN==="Win") winner=side;
    const riot=String(p.RIOT_ID_GAME_NAME||p.NAME||"").trim();
    const pid=rosterMatch(riot, taken); if(pid){ taken.add(pid); matched++; }
    const all={k:p.CHAMPIONS_KILLED, d:p.NUM_DEATHS, a:p.ASSISTS, dmg:p.TOTAL_DAMAGE_DEALT_TO_CHAMPIONS, heal:p.TOTAL_HEAL, cs:(+p.MINIONS_KILLED||0)+(+p.NEUTRAL_MINIONS_KILLED||0)};
    const stats={}; for(const k in all) if(keys.has(k)) stats[k]=String(num(all[k]));
    const multi={triple:p.TRIPLE_KILLS, quadra:p.QUADRA_KILLS, penta:p.PENTA_KILLS}; for(const k in multi) multi[k]=num(multi[k])?String(num(multi[k])):"";
    const augs=[1,2,3,4,5,6].map(i=>String(p["PLAYER_AUGMENT_"+i]||"0")).filter(x=>x!=="0").map(x=>names[x]||"Augment #"+x);
    const n=k=>num(p[k]), pings=Object.keys(p).filter(k=>/_PINGS$/.test(k)).reduce((t,k)=>t+n(k),0)+n("PING");
    const fun={time:n("TIME_PLAYED"), dead:n("TOTAL_TIME_SPENT_DEAD"), alive:n("LONGEST_TIME_SPENT_LIVING"), tower:n("TOTAL_DAMAGE_TAKEN_FROM_BUILDINGS"),
      reroll:n("2026_S2A2_Kiwi_AugmentRerolls"), pings, unspent:Math.max(0,n("GOLD_EARNED")-n("GOLD_SPENT")), mitig:n("TOTAL_DAMAGE_SELF_MITIGATED"),
      flash:n("SUMMON_SPELL1_CAST")+n("SUMMON_SPELL2_CAST"), cc:n("TIME_CCING_OTHERS"), dc:n("TIME_SPENT_DISCONNECTED"), snow:n("Missions_SnowballsHit"),
      spells:n("SPELL1_CAST")+n("SPELL2_CAST")+n("SPELL3_CAST")+n("SPELL4_CAST"), left:(p.WAS_LEAVER==="1"||p.WAS_AFK==="1")?1:0, ff:p.GAME_ENDED_IN_SURRENDER==="1"&&p.WIN!=="Win"?1:0};
    return {side, pid, riot, pick:String(p.SKIN||""), place:"", stats, multi, augments:augs.join(", "), fun};
  });
  rows.sort((a,b)=>a.side.localeCompare(b.side));
  const left=rep.players.filter(p=>p.WAS_LEAVER==="1"||p.WAS_AFK==="1").map(p=>p.RIOT_ID_GAME_NAME).filter(Boolean);
  const mins=rep.lengthMs?Math.round(rep.lengthMs/60000)+" min game. ":"";
  S.form.rows=rows; if(winner) S.form.winner=winner;
  S.form.replay=`Filled in from ${file.name}. ${mins}${matched} of ${rows.length} players matched to the roster. Pick who's who for the rest${S.isAdmin?", or press + to add them to the roster":""}. Anyone left blank isn't saved.${left.length?" Left the game: "+left.join(", ")+".":""}`;
  S.formErr=""; S.tab="matches"; render(); window.scrollTo({top:0,behavior:"smooth"});
}

const DEFAULT_PENALTIES=[
  "{name} gets their next champion picked by the winners.",
  "{name} plays the next game without Flash.",
  "{name} must take the first augment offered every round next game. No rerolls.",
  "{name} has to buy boots last next game.",
  "{name} must say \"my bad\" on voice after every death next game.",
  "{name} is on snacks and drinks for the next round.",
  "{name} has to type a genuine compliment to the enemy team in all chat next game.",
  "{name} plays a support next game, no arguments.",
  "{name} gets their summoner spells chosen by the group next game.",
  "{name} changes their Discord nickname to \"Feeder\" until they win a game.",
];
function penaltiesOn(){ return !!S.settings?.penalties?.on; }
function penaltyList(){ const l=S.settings?.penalty_list?.items; return Array.isArray(l)&&l.filter(Boolean).length?l.filter(Boolean):DEFAULT_PENALTIES; }
function uuid4(){ if(crypto.randomUUID) try{ return crypto.randomUUID(); }catch(_){} const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128; const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join(""); return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`; }
function hashStr(t){ let h=2166136261; for(const c of String(t)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
// The loser with the worst game takes the penalty; the same match always draws the same one.
function penaltyFor(g,m){
  if(!penaltiesOn()) return null;
  const es=m.entries||[]; if(!es.length) return null;
  let pool;
  if(g.format==="ffa") pool=[...es].sort((a,b)=>(+b.place||0)-(+a.place||0)).slice(0,1);
  else { if(!m.winner) return null; pool=es.filter(e=>e.team!==m.winner); }
  if(!pool.length) return null;
  const score=e=>g.kda?kdaVal(g,e.stats||{}):(g.mvpStat?(+e.stats?.[g.mvpStat]||0):0);
  const who=[...pool].sort((a,b)=>score(a)-score(b))[0];
  const list=penaltyList(), text=list[hashStr(m.id||"x")%list.length];
  return {pid:who.pid, text:String(text).replaceAll("{name}", pName(who.pid))};
}
function penaltyBar(g,m){
  const p=penaltyFor(g,m); if(!p) return "";
  return `<div class="pen"><span class="pen-t">⚖️ Penalty jar</span><span class="pen-x">${esc(p.text)}</span></div>`;
}

/* ---------- rivalries ---------- */
function rivalries(g,pid){
  if(g.format==="ffa") return null;
  const R={};
  for(const m of filtered()){
    const me=(m.entries||[]).find(e=>e.pid===pid); if(!me||!m.winner) continue;
    const won=me.team===m.winner;
    for(const e of m.entries){ if(e.pid===pid) continue;
      const r=(R[e.pid] ??= {pid:e.pid,vsG:0,vsW:0,wG:0,wW:0});
      if(e.team===me.team){ r.wG++; if(won) r.wW++; } else { r.vsG++; if(won) r.vsW++; }
    }
  }
  const rows=Object.values(R).filter(r=>S.players[r.pid]); if(!rows.length) return null;
  const vs=rows.filter(r=>r.vsG>=2), duo=rows.filter(r=>r.wG>=2);
  const nemesis=[...vs].filter(r=>r.vsW<r.vsG-r.vsW).sort((a,b)=>(b.vsG-b.vsW)-(a.vsG-a.vsW)||a.vsW/a.vsG-b.vsW/b.vsG)[0];
  const victim=[...vs].filter(r=>r.vsW>r.vsG-r.vsW).sort((a,b)=>b.vsW-a.vsW||b.vsW/b.vsG-a.vsW/a.vsG)[0];
  const best=[...duo].filter(r=>r.wW/r.wG>.5).sort((a,b)=>b.wW/b.wG-a.wW/a.wG||b.wG-a.wG)[0];
  const cursed=[...duo].filter(r=>r.wW/r.wG<.5).sort((a,b)=>a.wW/a.wG-b.wW/b.wG||b.wG-a.wG)[0];
  return {rows:rows.sort((a,b)=>(b.vsG+b.wG)-(a.vsG+a.wG)), nemesis, victim, best, cursed};
}
function rivalryPanel(g,pid){
  const r=rivalries(g,pid); if(!r) return "";
  const wl=(w,n)=>n?`<span class="num">${w}–${n-w}</span>`:'<span class="muted">–</span>';
  const card=(icon,title,x,line)=>x?`<button class="rv" data-act="view-player" data-pid="${esc(x.pid)}"><span class="rv-i">${icon}</span><span class="rv-t">${title}</span>${avatar(x.pid)}<b>${esc(pName(x.pid))}</b><span class="rv-l">${line}</span></button>`:"";
  const cards=[card("😈","Nemesis",r.nemesis,r.nemesis&&`Beaten you ${r.nemesis.vsG-r.nemesis.vsW} of ${r.nemesis.vsG}`),
    card("🎯","Favourite victim",r.victim,r.victim&&`You've won ${r.victim.vsW} of ${r.victim.vsG}`),
    card("🤝","Best duo",r.best,r.best&&`${pct(r.best.wW,r.best.wG)} wins together`),
    card("💔","Cursed duo",r.cursed,r.cursed&&`${pct(r.cursed.wW,r.cursed.wG)} wins together`)].filter(Boolean).join("");
  return `<div><h3 style="margin-bottom:8px">Rivalries</h3>${cards?`<div class="rv-grid">${cards}</div>`:`<p class="muted" style="margin:0 0 8px">Play a couple more games against the same people to unlock a nemesis.</p>`}
    <div class="tbl-wrap"><table class="mini"><thead><tr><th class="l">Player</th><th>Against</th><th>Together</th></tr></thead><tbody>${r.rows.slice(0,10).map(x=>`<tr><td class="l">${plLink(x.pid)}</td><td>${wl(x.vsW,x.vsG)}</td><td>${wl(x.wW,x.wG)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function achievementsFor(g,pid){
  const ms=S.matches.filter(m=>m.game===S.gameId && (m.entries||[]).some(e=>e.pid===pid))
    .sort((a,b)=>String(a.playedAt).localeCompare(String(b.playedAt)));
  const list=ms.map(m=>{ const e=m.entries.find(x=>x.pid===pid); return {m,e,win:isWin(g,m,e),mvp:mvpOf(g,m)===pid}; });
  let run=0,lrun=0,best=0,worst=0;
  for(const x of list){ if(x.win){ run++; lrun=0; } else { lrun++; run=0; } best=Math.max(best,run); worst=Math.max(worst,lrun); }
  const c={n:list.length, wins:list.filter(x=>x.win).length, mvps:list.filter(x=>x.mvp).length, bestStreak:best, worstStreak:worst, list};
  return achievementList(g).map(a=>({...a, got:!!a.ok(c)}));
}

/* ---------- discord post ---------- */
function plain(t){ return String(t||"").replace(/[*_~`|>\\]/g,""); }
function announceText(g,m){
  const L=[], nm=pid=>plain(pName(pid));
  L.push(`🎮 **${plain(g.name)}** · ${fmtDate(m.playedAt)}${m.note?" · "+plain(m.note):""}`);
  const es=m.entries||[];
  if(g.format==="ffa"){
    const r=[...es].sort((a,b)=>(+a.place||99)-(+b.place||99));
    L.push(r.slice(0,3).map((e,i)=>`${["🥇","🥈","🥉"][i]} ${nm(e.pid)}`).join("   "));
  } else if(m.winner){
    const team=t=>es.filter(e=>e.team===t).map(e=>nm(e.pid)+(e.pick?` (${plain(e.pick)})`:"")).join(", ");
    const lose=m.winner==="A"?"B":"A";
    L.push(`🏆 **Team ${m.winner} wins**${team(m.winner)?": "+team(m.winner):""}`);
    if(team(lose)) L.push(`💀 Team ${lose}: ${team(lose)}`);
  }
  const hl=headline(m).replace(/<[^>]+>/g,""); if(hl) L.push(`> ${plain(hl.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&"))}`);
  const mvp=mvpOf(g,m), me=es.find(e=>e.pid===mvp);
  if(me && g.mvpStat){ const s=me.stats||{}; L.push(`👑 MVP: **${nm(mvp)}**${g.kda?` ${+s[g.kda.k]||0}/${+s[g.kda.d]||0}/${+s[g.kda.a]||0}`:""}${me.pick?" on "+plain(me.pick):""}`); }
  for(const x of roastsFor(m,3)){ const c=roastCard(x); L.push(`${c.icon} **${c.title}**: ${nm(c.pid)}, ${c.fmt==="text"?c.text:fmtBig(c.num,c.fmt)} ${c.unit}`); }
  const p=penaltyFor(g,m); if(p) L.push(`⚖️ **Penalty jar**: ${plain(p.text)}`);
  L.push(`<${location.origin}${location.pathname}#matches>`);
  return L.join("\n").slice(0,1900);
}

/* ---------- form meter ---------- */
// Last 5 games, newest weighted most: wins push it up, losses down, and a game
// well above or below your usual KDA nudges it further.
function formOf(g,pid){
  const ms=filtered().filter(m=>(m.entries||[]).some(e=>e.pid===pid)).slice(0,5);
  if(ms.length<2) return null;
  const all=filtered().flatMap(m=>(m.entries||[]).filter(e=>e.pid===pid));
  const avgK=g.kda?Math.max(.5,kdaVal(g,all.reduce((t,e)=>{ for(const k in e.stats||{}) t[k]=(t[k]||0)+(+e.stats[k]||0); return t; },{}))):0;
  let sum=0, wsum=0; const res=[];
  ms.forEach((m,i)=>{ const e=m.entries.find(x=>x.pid===pid), w=isWin(g,m,e), wt=5-i;
    let v=w?1:-1;
    if(g.kda){ const k=kdaVal(g,e.stats||{}); v=v*.65+Math.max(-1,Math.min(1,(k-avgK)/avgK))*.35; }
    sum+=v*wt; wsum+=wt; res.push(w); });
  const score=sum/wsum;
  const lv=score>=.55?["🔥","On fire","hot"]:score>=.2?["📈","Heating up","warm"]:score>-.2?["😐","Lukewarm","mid"]:score>-.55?["📉","Cooling off","cool"]:["🧊","Ice cold","cold"];
  return {score, icon:lv[0], label:lv[1], cls:lv[2], res};
}
function formIcon(g,pid){ const f=formOf(g,pid); return f&&(f.cls==="hot"||f.cls==="cold")?`<span class="form-ico" title="${esc(f.label)} (last 5 games)">${f.icon}</span>`:""; }
function formMeter(f){
  if(!f) return `<div class="fm"><div class="fm-top"><span class="fm-l">Form</span><span class="muted">Needs 2+ games</span></div><div class="fm-bar"><i style="left:50%"></i></div></div>`;

    <div class="fm-bar"><i style="left:${Math.round((f.score+1)/2*100)}%"></i></div>
    <div class="fm-res">${[...f.res].reverse().map(w=>`<span class="pip ${w?"w":"l"}">${w?"W":"L"}</span>`).join("")}<span class="muted">last ${f.res.length}, oldest first</span></div></div>`;

function cardData(pid){

  const sig=r?Object.values(r.picks).sort((a,b)=>b.games-a.games||b.wins-a.wins)[0]:null;

const CLIP_SR=22050, CLIP_LEN=10, CLIP_PRE=6, MAX_CANDS=8;
function clipUrl(path){ return `${window.RUMBLE_CONFIG.supabaseUrl}/storage/v1/object/public/clips/${path}`; }
function clipsFor(mid){ return (S.clips||[]).filter(c=>c.match_id===mid).sort((a,b)=>(a.at_s||0)-(b.at_s||0)); }
let PLAYER=null;
function playUrl(url,id){

  const a=new Audio(url); a._id=id; PLAYER=a; S.playing=id; a.onended=()=>{ if(PLAYER===a){ PLAYER=null; S.playing=null; render(); } };

}
let PREVIEW=null;
function playSamples(data,id){
  if(PREVIEW){ try{ PREVIEW.src.stop(); }catch(_){} const was=PREVIEW.id; PREVIEW=null; S.playing=null; if(was===id){ render(); return; } }
  const ctx=(playSamples.ctx ??= new (window.AudioContext||window.webkitAudioContext)());
  const buf=ctx.createBuffer(1,data.length,CLIP_SR); buf.copyToChannel(data,0);
  const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start();
  PREVIEW={src,id}; S.playing=id; src.onended=()=>{ if(PREVIEW?.src===src){ PREVIEW=null; S.playing=null; render(); } }; render();
}
function stopAudio(){ if(PLAYER){ PLAYER.pause(); PLAYER=null; } if(PREVIEW){ try{ PREVIEW.src.stop(); }catch(_){} PREVIEW=null; } S.playing=null; }

// Decode at a low sample rate to keep memory sane on long recordings, mixed to mono.
async function decodeMono(file){
  const bytes=await file.arrayBuffer();
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const ctx=new OAC(1,1,CLIP_SR);
  const buf=await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(bytes,res,rej); if(p&&p.catch) p.catch(rej); });
  const n=buf.length, out=new Float32Array(n), ch=buf.numberOfChannels;
  for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) out[i]+=d[i]/ch; }
  return out;
}
// Find the loudest bursts relative to the speaker's normal level: shouting, screaming, laughing.
function findMoments(x, max=MAX_CANDS){
  const hop=Math.round(CLIP_SR*.1), F=Math.floor(x.length/hop); if(F<50) return [];
  const db=new Float32Array(F);
  for(let f=0;f<F;f++){ let s=0; for(let i=f*hop,e=i+hop;i<e;i++) s+=x[i]*x[i]; db[f]=10*Math.log10(s/hop+1e-12); }
  const voiced=[...db].filter(v=>v>-55).sort((a,b)=>a-b);
  if(voiced.length<20) return [];
  const base=voiced[Math.floor(voiced.length*.5)], loudRef=voiced[Math.floor(voiced.length*.97)];
  const thr=Math.max(base+8, loudRef-6);
  const exc=Float32Array.from(db,v=>Math.max(0,v-thr));
  const W=30, score=new Float32Array(F); let run=0;            // 3 s window
  for(let f=0;f<F;f++){ run+=exc[f]; if(f>=W) run-=exc[f-W]; score[f]=run; }
  const picks=[], used=new Uint8Array(F), gap=200;              // 20 s apart
  while(picks.length<max){
    let bi=-1, bv=0; for(let f=0;f<F;f++) if(!used[f]&&score[f]>bv){ bv=score[f]; bi=f; }
    if(bi<0||bv<4) break;
    let pk=bi; for(let f=Math.max(0,bi-W);f<=bi;f++) if(db[f]>db[pk]) pk=f;
    picks.push({t:pk*hop/CLIP_SR, score:bv});
    for(let f=Math.max(0,bi-gap);f<Math.min(F,bi+gap);f++) used[f]=1;
  }
  return picks.map(p=>{ const start=Math.max(0,Math.min(x.length/CLIP_SR-CLIP_LEN, p.t-CLIP_PRE));
    const a=Math.floor(start*CLIP_SR), b=Math.min(x.length,a+CLIP_LEN*CLIP_SR), seg=x.slice(a,b);
    let pkv=0; for(const v of seg) pkv=Math.max(pkv,Math.abs(v)); const g=pkv>0?Math.min(4,.9/pkv):1;
    for(let i=0;i<seg.length;i++){ let v=seg[i]*g; const fade=Math.min(1,i/(CLIP_SR*.05),(seg.length-i)/(CLIP_SR*.3)); seg[i]=v*fade; }
    return {t:start, score:p.score, data:seg}; });
}
function wavBlob(f32){
  const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,CLIP_SR,true); v.setUint32(28,CLIP_SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2,s<0?s*32768:s*32767,true); }
  return new Blob([buf],{type:"audio/wav"});
}
const fmtT=s=>{ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0"); };

async function analyseFiles(files){
  const C=S.clipper; if(!C) return;
  C.busy=true; C.msg=""; render();
  for(const file of files){
    if(file.size>400*1024*1024){ C.msg=`${file.name} is over 400 MB. Trim it or export a lower quality.`; continue; }
    const fi=C.files.length; C.files.push({name:file.name, pid:"", state:"Listening…"}); render();
    try{
      const x=await decodeMono(file);
      const found=findMoments(x);
      C.files[fi].state=found.length?`${found.length} moment${found.length===1?"":"s"} · ${fmtT(x.length/CLIP_SR)} long`:"Nothing loud enough found";
      found.forEach(f=>C.cands.push({id:"c"+Math.random().toString(36).slice(2,8), file:fi, t:f.t, score:f.score, data:f.data, keep:true, label:""}));
    }catch(err){ console.error(err); C.files[fi].state="Couldn't read this file. Try MP3, OGG, FLAC or WAV."; }
    render();
  }
  C.cands.sort((a,b)=>b.score-a.score);
  C.busy=false; render();
}
async function uploadClips(){

      const path=`${C.mid}/${uuid4()}.wav`;
      const up=await S.sb.storage.from("clips").upload(path, wavBlob(c.data), {contentType:"audio/wav", upsert:false});
      if(up.error) throw up.error;
      const pid=C.files[c.file]?.pid||null;
      const {error}=await S.sb.from("clips").insert({match_id:C.mid, path, label:(c.label||"").trim().slice(0,80)||null, pid, at_s:Math.round(c.t*10)/10, dur_s:Math.round(c.data.length/CLIP_SR*10)/10});
      if(error) throw error;
      done++; C.msg=`Uploading ${done} of ${keep.length}…`; render();
    }
    stopAudio(); S.clipper=null; await loadClips(); render(); toast(`${done} clip${done===1?"":"s"} added`);
  }catch(err){ console.error(err); C.busy=false; C.msg=`Uploaded ${done} of ${keep.length}. ${writeError(err)}`; render(); }
}

function clipStrip(m){

  return `<div class="clips-row"><span class="clips-t">🎙 Comms</span>${cs.map(c=>clipChip(c)).join("")}</div>`;
}
function clipChip(c, big){
  const mine=c.created_by===S.me?.id;
  return `<span class="clip${big?" big":""}${S.playing===c.id?" on":""}"><button class="play" data-act="clip-play" data-id="${esc(c.id)}" aria-label="Play clip">${S.playing===c.id?"■":"▶"}</button><span class="clip-l">${esc(c.label||(c.pid?pName(c.pid):"Comms clip"))}${c.label&&c.pid?` <small>${esc(pName(c.pid))}</small>`:""}</span>${!big&&(mine||S.isAdmin)?`<button class="clip-x" data-act="clip-del" data-id="${esc(c.id)}" title="Delete clip" aria-label="Delete clip">✕</button>`:""}</span>`;
}

function playerDetail(g,pid){
  const ms=filtered().filter(m=>(m.entries||[]).some(e=>e.pid===pid));
  const r=aggregate(g,ms).find(x=>x.pid===pid);
  const all=aggregate(g,filtered()); const rank=all.findIndex(x=>x.pid===pid)+1;
  const p=S.players[pid], isMe=pid===myPlayer();
  const editing = S.editTag!==null && isMe;
  const head = `<div class="ph">${avatar(pid)}<div><h2>${esc(p.tag)}</h2><span class="muted">${p.uid?(isMe?"This is you":(p.approved?"Discord player":"Waiting for approval")):"Not claimed yet"}${rank?` · Rank ${rank} in ${esc(g.name)}`:""}</span></div>
    </div>`;
  if(!r) return `<section class="panel">${head}<p class="muted" style="margin:0">No ${esc(g.name)} matches ${S.season==="all"?"yet":"in the "+esc(S.season)+" tournament"}.</p></section>`;
  const tiles=[["Points",r.pts],["Record",`${r.wins}–${r.losses}`],["Win rate",pct(r.wins,r.games)]];
  if(g.kda) tiles.push(["KDA",fmt1(r.kda)]);
  if(g.format==="ffa") tiles.push(["Avg place",fmt1(r.placeSum/r.games)]);
  if(g.mvpStat) tiles.push(["MVPs",r.mvps]);
  if(g.multikills) tiles.push(["Pentakills",r.multi.penta||0]);
  for(const st of g.stats||[]) tiles.push(["Avg "+lc(st.label), fmt1(r.sums[st.key]/r.games)]);
  const picks=Object.values(r.picks).sort((a,b)=>b.games-a.games||b.wins-a.wins);
  const augs=Object.values(r.augs).sort((a,b)=>b.games-a.games||b.wins-a.wins).slice(0,6);
  const augTbl = g.augments && augs.length ? `<div><h3 style="margin-bottom:6px">Favourite augments</h3><div class="tbl-wrap"><table><thead><tr><th class="l">Augment</th><th>Picked</th><th>Win %</th></tr></thead><tbody>${augs.map(a=>`<tr><td class="l">${esc(a.name)}</td><td>${a.games}</td><td>${pct(a.wins,a.games)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
  const tro=(S._trophies||{})[pid]||[];
  const cabinet = tro.length ? `<div class="row-fields" style="align-items:center"><span class="label">Trophy cabinet</span>${tro.map(x=>x.penta?`<span class="tag penta">Pentakill</span>`:`<span class="tag trophy">${TROPHY_ICON}${esc(x.title)}</span>`).join("")}</div>` : "";
  const picksTbl = g.pickLabel && picks.length ? `<div><h3 style="margin-bottom:6px">${esc(g.pickLabel)} pool</h3><div class="tbl-wrap"><table><thead><tr><th class="l">${esc(g.pickLabel)}</th><th>Played</th><th>W</th><th>Win %</th></tr></thead><tbody>${picks.map(k=>`<tr><td class="l">${esc(k.name)}</td><td>${k.games}</td><td>${k.wins}</td><td>${pct(k.wins,k.games)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
  const hist = `<div><h3 style="margin-bottom:6px">Recent matches</h3><div class="tbl-wrap"><table><thead><tr><th class="l">Date</th><th class="l">Result</th>${g.pickLabel?`<th class="l">${esc(g.pickLabel)}</th>`:""}<th>Stats</th><th>Pts</th></tr></thead><tbody>${ms.slice(0,10).map(m=>{const e=m.entries.find(x=>x.pid===pid); const mvp=mvpOf(g,m); const w=isWin(g,m,e); return `<tr><td class="l">${esc(fmtDate(m.playedAt))}</td><td class="l"><span class="tag ${w?"win":"loss"}">${g.format==="ffa"?"#"+(+e.place||"–"):(w?"Win":"Loss")}</span>${mvp===pid&&g.mvpStat?' <span class="tag mvp">MVP</span>':""}</td>${g.pickLabel?`<td class="l">${esc(e.pick||"")}</td>`:""}<td>${statLine(g,e.stats)}</td><td>${entryPoints(g,m,e,mvp)}</td></tr>`;}).join("")}</tbody></table></div></div>`;
  return `<section class="panel">${head}<div class="tiles">${tiles.map(([l,v])=>`<div class="tile"><span class="label">${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>${cabinet}${achievementPanel(g,pid)}${rivalryPanel(g,pid)}${picksTbl}${augTbl}${hist}</section>`;
}

function gameFromForm(){
  const n=S.ng; const name=n.name.trim(); if(!name) return "Give the game a name.";
  const labels=n.stats.split(",").map(s=>s.trim()).filter(Boolean).slice(0,10);
  const stats=[]; const used=new Set();
  for(const l of labels){ let k=slug(l).replace(/-/g,"_"); while(used.has(k)) k+="_"; used.add(k); stats.push({key:k,label:l.slice(0,24)}); }
  const find = l => stats.find(s=>s.label.toLowerCase()===l.trim().toLowerCase())?.key;
  const kk=find("kills"), dk=find("deaths"), ak=find("assists");
  const kda = kk&&dk&&ak ? {k:kk,d:dk,a:ak} : null;
  const mvpIn=n.mvp.trim(); let mvpStat=null;
  if(mvpIn){ if(mvpIn.toLowerCase()==="kda"){ if(!kda) return "MVP by KDA needs stats called Kills, Deaths and Assists."; mvpStat="kda"; } else { mvpStat=find(mvpIn); if(!mvpStat) return `"${mvpIn}" isn't one of the stats you listed.`; } }
  let shameStat=null; if(n.shame.trim()){ shameStat=find(n.shame); if(!shameStat) return `"${n.shame.trim()}" isn't one of the stats you listed.`; }
  const points = n.format==="ffa" ? {placements:n.placements.split(",").map(x=>+x.trim()||0).slice(0,20), mvp:+n.mvpPts||0} : {win:+n.win||0, loss:+n.loss||0, mvp:+n.mvpPts||0};
  return {name:name.slice(0,40), format:n.format, teamSize:Math.max(1,Math.min(20,+n.teamSize||5)), pickLabel:n.pickLabel.trim().slice(0,20)||null, stats, kda, shameStat, mvpStat, points};
}
async function addGame(def){
  let id=slug(def.name), i=2; while(S.games[id]) id=slug(def.name)+"-"+(i++);
  const order=Math.max(0,...Object.values(S.games).map(g=>g.order||0))+1;
  try{ const {error}=await S.sb.from("games").insert({id, config:{...def, order}}); if(error) throw error; S.gameId=id; await loadAll(); toast(def.name+" added"); return true; }
  catch(e){ toast(writeError(e)); return false; }
}

/* ---------- events ---------- */
function setPath(path, val){
  const parts=path.split("."); let o=S;
  for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(o==null) return; }
  o[parts[parts.length-1]]=val;
}
document.addEventListener("keydown", e=>{ if(S.clipper && e.key==="Escape" && !S.clipper.busy){ stopAudio(); S.clipper=null; render(); return; } if(S.card && e.key==="Escape"){ S.card=null; render(); return; } if(S.show && ceremonyKey(e)) return; const id=e.target.id||""; if(e.key==="Enter" && id.startsWith("c-")){ e.preventDefault(); document.querySelector(`[data-act="post-talk"][data-id="${CSS.escape(id.slice(2))}"]`)?.click(); } });
document.addEventListener("input", e=>{ const b=e.target.dataset?.bind; if(b) setPath(b, e.target.value); });
document.addEventListener("change", e=>{
  const t=e.target, b=t.dataset?.bind;
  if(b){ setPath(b,t.value); if(t.dataset.rerender) render(); }
  if(t.dataset?.act==="season"){ S.season=t.value; render(); }
  if(t.dataset?.act==="winner"){ S.form.winner=t.value; render(); }
  if(t.dataset?.act==="clip-files" && t.files?.length){ const fs=[...t.files]; t.value=""; analyseFiles(fs); }
  if(t.dataset?.act==="clip-keep" && S.clipper){ const c=S.clipper.cands[+t.dataset.i]; if(c){ c.keep=t.checked; render(); } }
  if(t.dataset?.act==="rofl" && t.files?.[0]){ const file=t.files[0]; t.value=""; importReplay(file); }
});

      try{ const {data,error}=await S.sb.from("players").insert({tag:tag.slice(0,32), user_id:S.me.id, avatar:S.me.avatar||null}).select("id").single(); if(error) throw error; S.viewPlayer=data.id; S.join.tag=""; await loadAll(); toast("Welcome to the roster, "+tag); }catch(err){ toast(writeError(err)); } break; }
    case "claim": try{ const {error}=await S.sb.from("players").update({user_id:S.me.id, tag:S.me.name.slice(0,32), avatar:S.me.avatar||null}).eq("id",el.dataset.pid); if(error) throw error; S.viewPlayer=el.dataset.pid; await loadAll(); toast("Name claimed"); }catch(err){ toast(writeError(err)); } break;
    case "approve": try{ const {error}=await S.sb.from("players").update({approved:true}).eq("id",el.dataset.pid); if(error) throw error; await loadAll(); toast(pName(el.dataset.pid)+" approved"); }catch(err){ toast(writeError(err)); } break;
    case "reject": try{ const {error}=await S.sb.from("players").update({user_id:null, avatar:null}).eq("id",el.dataset.pid); if(error) throw error; await loadAll(); toast("Removed from the approval list"); }catch(err){ toast(writeError(err)); } break;
    case "login": { const {error}=await S.sb.auth.signInWithOAuth({provider:"discord", options:{redirectTo:location.origin+location.pathname}}); if(error) toast("Couldn't start Discord login: "+error.message); break; }
    case "logout": await S.sb.auth.signOut(); break;
    case "add-player": { const tag=S.addp.tag.trim(); if(!tag){ toast("Type your friend's Discord name first."); break; }
      if(Object.values(S.players).some(p=>p.tag.toLowerCase()===tag.toLowerCase())){ toast(tag+" is already on the roster."); break; }
      try{ const {error}=await S.sb.from("players").insert({tag:tag.slice(0,32), user_id:null}); if(error) throw error; S.addp.tag=""; await loadAll(); toast(tag+" added"); }catch(err){ toast(writeError(err)); } break; }
    case "edit-tag": S.editTag=S.players[myPlayer()].tag; render(); break;
    case "cancel-tag": S.editTag=null; render(); break;
    case "save-tag": { const t=(S.editTag||"").trim(); if(!t) break; try{ const {error}=await S.sb.from("players").update({tag:t.slice(0,32)}).eq("id",myPlayer()); if(error) throw error; S.editTag=null; await loadAll(); toast("Gamer tag updated"); }catch(err){ toast(writeError(err)); } break; }
    case "post-talk": { const body=(S.cdraft[id]||"").trim(); if(!body) break;
      try{ const {error}=await S.sb.from("comments").insert({match_id:id, body:body.slice(0,280), author:S.me.id}); if(error) throw error; S.cdraft[id]=""; await loadAll(); }catch(err){ toast(writeError(err)); } break; }
    case "del-talk": try{ const {error}=await S.sb.from("comments").delete().eq("id",id); if(error) throw error; await loadAll(); }catch(err){ toast(writeError(err)); } break;
    case "ask-game-del": S.confirmGameDel=id; render(); break;
    case "cancel-game-del": S.confirmGameDel=null; render(); break;
    case "del-game": try{ const {error}=await S.sb.from("games").delete().eq("id",id); if(error) throw error; S.confirmGameDel=null; if(S.gameId===id) S.gameId=null; await loadAll(); toast("Game removed"); }catch(err){ toast(writeError(err)); } break;
    case "tpl": if(await addGame(TEMPLATES[id])){ S.tab = S.tab==="games"?"games":"standings"; render(); } break;
    case "add-game": { const def=gameFromForm(); if(typeof def==="string"){ toast(def); break; } if(await addGame(def)){ S.ng={...S.ng,name:"",stats:"",shame:"",mvp:"",pickLabel:""}; render(); } break; }
  }
});

/* ---------- boot ---------- */
async function loadAll(){
  const [g,p,m] = await Promise.all([
    S.sb.from("games").select("id,config"),
    S.sb.from("players").select("id,tag,user_id,approved,avatar"),
    S.sb.from("matches").select("id,game,season,played_at,winner,note,entries").order("played_at",{ascending:false}).limit(5000)
  ]);
  const err=g.error||p.error||m.error;
  if(err){ toast("Couldn't load the scoreboard. Reload the page."); console.error(err); return; }
  S.games=Object.fromEntries(g.data.map(r=>[r.id,r.config||{}]));
  S.players=Object.fromEntries(p.data.map(r=>[r.id,{tag:r.tag,uid:r.user_id,approved:r.approved,avatar:r.avatar}]));
  if(!S.commentsOff){ const c=await S.sb.from("comments").select("id,match_id,author,body,created_at").order("created_at",{ascending:true}).limit(5000); if(c.error) S.commentsOff=true; else S.comments=c.data; }
  if(!S.settingsOff){ const st=await S.sb.from("app_settings").select("key,value"); if(st.error) S.settingsOff=true; else S.settings=Object.fromEntries(st.data.map(r=>[r.key,r.value])); }
  await loadClips();
  S.matches=m.data.map(r=>({id:r.id,game:r.game,season:r.season,playedAt:r.played_at,winner:r.winner,note:r.note,entries:r.entries||[]}));
  if(!S.gameId || !S.games[S.gameId]){ const first=Object.entries(S.games).sort((a,b)=>(a[1].order||0)-(b[1].order||0))[0]; S.gameId=first?first[0]:null; }
  S.ready=true; computeAccess(); render();
}
async function onAuth(session){
  const u=session?.user;
  if(u){
    const md=u.user_metadata||{};
    S.me={id:u.id, name:md.custom_claims?.global_name||md.full_name||md.name||"Discord user", avatar:md.avatar_url||null};
    const {data}=await S.sb.rpc("is_admin"); S.isAdmin=data===true;
  } else { S.me=null; S.isAdmin=false; }
  S.authReady=true; computeAccess(); render();
  const mine=myPlayer();
  if(mine){
    const tag=S.me.name.slice(0,32), patch={};
    if(S.players[mine].tag!==tag) patch.tag=tag;
    if(S.me.avatar && S.players[mine].avatar!==S.me.avatar) patch.avatar=S.me.avatar;
    if(Object.keys(patch).length) S.sb.from("players").update(patch).eq("id",mine).then(()=>loadAll());
  }
}
render();
(async ()=>{
  const cfg=window.RUMBLE_CONFIG||{};
  if(!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey || /YOUR-/.test(cfg.supabaseUrl)){ S.noDb=true; render(); return; }
  S.sb=window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  await loadAll();
  const {data:{session}}=await S.sb.auth.getSession();
  await onAuth(session);
  S.sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") onAuth(session).then(loadAll); });
  let t; const refresh=()=>{ clearTimeout(t); t=setTimeout(loadAll,300); };
  S.sb.channel("scoreboard")
    .on("postgres_changes",{event:"*",schema:"public",table:"games"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"players"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"matches"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"comments"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"app_settings"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"clips"},refresh)
    .subscribe();
})();
</script>
